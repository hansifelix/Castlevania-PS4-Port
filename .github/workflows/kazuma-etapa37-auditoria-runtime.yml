name: 'Kazuma Etapa 37 - auditoria de compilacao de TODO runtime x86-64 PS4 (SEM PKG)'
on:
  pull_request:
    paths:
      - '.github/workflows/kazuma-etapa37-auditoria-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventario-runtime-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Kazuma
        uses: actions/checkout@v4
      - name: Instalar compiladores e ferramentas
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 lld-18 binutils git curl ca-certificates python3
      - name: Obter SDK e runtime publico de commits fixados
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk" "$RUNNER_TEMP/download" relatorios/etapa37
          curl -fLsS --retry 3 --retry-delay 3 \
            'https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz' \
            -o "$RUNNER_TEMP/download/openorbis.tar.gz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/download/openorbis.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/download/openorbis.tar.gz" -C "$RUNNER_TEMP/sdk"
          sdk_link="$(find "$RUNNER_TEMP/sdk" -type f -name link.x -print -quit)"
          test -n "$sdk_link"
          echo "OO_PS4_TOOLCHAIN=$(dirname "$sdk_link")" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --sparse https://github.com/SwonDev/cstlvnia-blmont-to-macos.git "$RUNNER_TEMP/nx-src"
          git -C "$RUNNER_TEMP/nx-src" checkout -q --detach 4043f21bb4f656d34cd17ba070238c7728d00631
          git -C "$RUNNER_TEMP/nx-src" sparse-checkout set runtime/src runtime/include/nx
          test -s "$RUNNER_TEMP/nx-src/runtime/src/nvn/nvn_vk.cpp"
          git -C "$RUNNER_TEMP/nx-src" show HEAD:LICENSE > relatorios/etapa37/LICENCA_MIT_UPSTREAM.txt
          echo 'KAZUMA_NX_SOURCE='"$RUNNER_TEMP/nx-src" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --sparse https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vkh"
          git -C "$RUNNER_TEMP/vkh" checkout -q --detach acbb9391c0a597272800cd3f4363661c00a27c77
          git -C "$RUNNER_TEMP/vkh" sparse-checkout set include/vulkan include/vk_video
          test -s "$RUNNER_TEMP/vkh/include/vk_video/vulkan_video_codec_h264std.h"
          echo 'KAZUMA_VK_HEADERS='"$RUNNER_TEMP/vkh/include" >> "$GITHUB_ENV"
          printf '%s\n' \
            'SwonDev/cstlvnia-blmont-to-macos @ 4043f21bb4f656d34cd17ba070238c7728d00631 (MIT)' \
            'Vulkan-Headers @ acbb9391c0a597272800cd3f4363661c00a27c77' \
            'OpenOrbis v0.5.4, SHA256 validado' \
            'Sem APK, codigo comercial, recursos do jogo, PKG ou execucao real no PS4.' \
            > relatorios/etapa37/FONTES.txt
      - name: Compatibilidade C++20 temporaria identica as Etapas 35 e 36
        run: |
          set -euo pipefail
          src="$KAZUMA_NX_SOURCE/runtime/include/nx/cpu.h"
          mkdir -p "$RUNNER_TEMP/compat/nx"
          cat > "$RUNNER_TEMP/compat/nx/kazuma_cpu_compat.h" <<'CPP'
          #pragma once
          #include <cstdint>
          #include <type_traits>
          namespace kazuma_cpu_compat {
          template <typename To, typename From>
          constexpr To bit_cast(const From& from) noexcept {
              static_assert(sizeof(To) == sizeof(From));
              static_assert(std::is_trivially_copyable_v<To> && std::is_trivially_copyable_v<From>);
              return __builtin_bit_cast(To, from);
          }
          template <typename T>
          constexpr T rotr(T value, int shift) noexcept {
              static_assert(std::is_unsigned_v<T>);
              constexpr int bits = int(sizeof(T) * 8);
              int n = ((shift % bits) + bits) % bits;
              return n ? T((value >> n) | (value << (bits - n))) : value;
          }
          }
          CPP
          python3 - "$src" "$RUNNER_TEMP/compat/nx/cpu.h" <<'PY_COMPAT'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text(encoding='utf-8')
          assert s.count('#include <bit>')==1 and s.count('std::bit_cast')>=5 and s.count('std::rotr(')==2
          patched=(s.replace('#include <bit>', '#include "kazuma_cpu_compat.h"')
                    .replace('std::bit_cast', 'kazuma_cpu_compat::bit_cast')
                    .replace('std::rotr(', 'kazuma_cpu_compat::rotr('))
          Path(sys.argv[2]).write_text(patched, encoding='utf-8')
          PY_COMPAT
      - name: Inventariar e compilar unidades portaveis de TODO runtime
        run: |
          set -euo pipefail
          src="$KAZUMA_NX_SOURCE"
          sdk="$OO_PS4_TOOLCHAIN"
          out="$RUNNER_TEMP/kazuma37"
          mkdir -p "$out/objects" relatorios/etapa37/erros
          flags=(--target=x86_64-pc-freebsd12-elf -std=c++20 -O0 -fPIC
            -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE
            -isysroot "$sdk" -isystem "$sdk/include" -isystem "$sdk/include/c++/v1"
            -I"$RUNNER_TEMP/compat" -I"$src/runtime/include" -I"$src/runtime/src"
            -I"$src/runtime/src/nvn" -I"$KAZUMA_VK_HEADERS")
          total=0; attempted=0; compiled=0; failed=0; skipped=0
          nvn_total=0; nvn_compiled=0; nvn_failed=0
          printf 'status\tmodulo\tmotivo\n' > relatorios/etapa37/INVENTARIO.tsv
          : > relatorios/etapa37/RESUMO_ERROS.txt
          : > "$out/objects.lst"
          # Excluimos APENAS implementacoes explicitamente especificas de outros SO,
          # e o launcher main (depende da plataforma). O restante sera testado, inclusive os que falharem.
          while IFS= read -r file; do
            rel="${file#"$src/"}"
            total=$((total+1))
            if [[ "$rel" == runtime/src/nvn/* ]]; then nvn_total=$((nvn_total+1)); fi
            case "$rel" in
              runtime/src/platform_*.cpp|runtime/src/memguard_*.cpp|runtime/src/mac_memory.cpp|runtime/src/main.cpp)
                skipped=$((skipped+1))
                printf 'IGNORADO\t%s\timplementacao especifica de SO ou launcher (precisa PS4)\n' "$rel" >> relatorios/etapa37/INVENTARIO.tsv
                continue;;
            esac
            attempted=$((attempted+1))
            obj="$out/objects/${rel//\//_}.o"
            log="$out/compilacao.log"
            echo "[ETAPA37] $attempted: $rel"
            if clang++-18 "${flags[@]}" -c "$file" -o "$obj" > "$log" 2>&1; then
              compiled=$((compiled+1))
              if [[ "$rel" == runtime/src/nvn/* ]]; then nvn_compiled=$((nvn_compiled+1)); fi
              printf '%s\n' "$obj" >> "$out/objects.lst"
              printf 'OK\t%s\tobjeto x86-64 gerado\n' "$rel" >> relatorios/etapa37/INVENTARIO.tsv
            else
              failed=$((failed+1))
              if [[ "$rel" == runtime/src/nvn/* ]]; then nvn_failed=$((nvn_failed+1)); fi
              printf 'FALHOU\t%s\tconsultar RESUMO_ERROS.txt\n' "$rel" >> relatorios/etapa37/INVENTARIO.tsv
              printf '\n========== %s ==========\n' "$rel" >> relatorios/etapa37/RESUMO_ERROS.txt
              grep -E -m 7 '(^| )fatal error:|(^| )error:|file not found|undefined reference' "$log" >> relatorios/etapa37/RESUMO_ERROS.txt || tail -n 10 "$log" >> relatorios/etapa37/RESUMO_ERROS.txt
              # Arquivo de log apenas dos erros; o conjunto total pode ser grande.
              base="${rel//\//_}"
              cp "$log" "relatorios/etapa37/erros/${base}.log"
            fi
          done < <(find "$src/runtime/src" -type f -name '*.cpp' | LC_ALL=C sort)
          printf 'ARQUIVOS_CPP_TOTAIS=%d\nARQUIVOS_TESTADOS=%d\nCOMPILARAM=%d\nFALHARAM=%d\nIGNORADOS_SO_HOST=%d\nNVN_TOTAIS=%d\nNVN_COMPILARAM=%d\nNVN_FALHARAM=%d\n' \
            "$total" "$attempted" "$compiled" "$failed" "$skipped" "$nvn_total" "$nvn_compiled" "$nvn_failed" \
            | tee relatorios/etapa37/CONTAGEM.txt
          if (( attempted != compiled + failed || total != attempted + skipped )); then
            echo 'ERRO: contagens inconsistentes' >&2; exit 1;
          fi
          test "$compiled" -ge 3 || { echo 'ERRO: menos de tres modulos compilados' >&2; exit 1; }
          # Arquivo de bibliotecas compiladas e link parcial, sem representar programa executavel.
          mapfile -t objs < "$out/objects.lst"
          llvm-ar-18 rcs "$out/libkazuma-runtime-partial.a" "${objs[@]}"
          if ld.lld-18 -m elf_x86_64 -r -o "$out/runtime_partial.o" "${objs[@]}" \
              > relatorios/etapa37/LINK_PARCIAL.log 2>&1; then
            printf 'LINK_PARCIAL_RELOCAVEL=SIM\n' | tee relatorios/etapa37/LINK_STATUS.txt
            llvm-nm-18 -C -u "$out/runtime_partial.o" | LC_ALL=C sort -u > relatorios/etapa37/SIMBOLOS_EXTERNOS.txt || true
          else
            printf 'LINK_PARCIAL_RELOCAVEL=NAO\n' | tee relatorios/etapa37/LINK_STATUS.txt
            printf 'O LINK PARCIAL FALHOU; nao ha executavel. Consulte LINK_PARCIAL.log\n' >> relatorios/etapa37/RESUMO_ERROS.txt
          fi
          sha256sum "$out/libkazuma-runtime-partial.a" > relatorios/etapa37/ARQUIVO_SHA256.txt
          echo 'Auditoria finalizada: objetos de compilacao, NAO runtime executavel, SEM PKG e SEM teste PS4.'
          # Falha aqui vira check vermelho, mas os relatorios sao publicados no proximo step.
          if (( failed > 0 )); then
            echo "CHECK VERMELHO ESPERADO: $failed componentes precisam de adaptacao. Veja relatorios/etapa37/"
            exit 1
          fi
          [[ -s relatorios/etapa37/LINK_STATUS.txt ]] && grep -q 'LINK_PARCIAL_RELOCAVEL=SIM' relatorios/etapa37/LINK_STATUS.txt
      - name: Publicar diagnosticos SEM artefatos comerciais ou PKG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kazuma-etapa37-auditoria-runtime-inteiro-sem-pkg
          path: relatorios/etapa37/
          if-no-files-found: warn
          retention-days: 20
