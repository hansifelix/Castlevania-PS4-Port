name: Kazuma - SPIR-V para GCN shader compiler real no PS4
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/kazuma-psbc-openorbis.yml'
      - 'tools/etapa186/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/kazuma-psbc-openorbis.yml'
      - 'tools/etapa186/**'
permissions:
  contents: read
jobs:
  psbc-orbis-shaders:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Obter SDK oficial OpenOrbis e geradores Mesa
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 lld-18 curl make python3-mako python3-ply python3-yaml
          mkdir -p "$RUNNER_TEMP/sdk" "$RUNNER_TEMP/dl"
          curl -fLsS --retry 3 --retry-delay 3 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o "$RUNNER_TEMP/dl/sdk.tar.gz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/dl/sdk.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/dl/sdk.tar.gz" -C "$RUNNER_TEMP/sdk"
          sdk="$(find "$RUNNER_TEMP/sdk" -name link.x -type f -print -quit)"
          test -n "$sdk"
          echo "PS4SDK=$(dirname "$sdk")" >> "$GITHUB_ENV"
      - name: Fontes abertas e revisoes imutaveis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shaders"
          cd "$RUNNER_TEMP/shaders"
          git clone -q --filter=blob:none https://github.com/PS4-OpenGNM/opengnm-psbc.git
          git -C opengnm-psbc checkout --detach 28697f007862427ebec54388ec972ce6e3545912
          git clone -q --filter=blob:none https://github.com/PS4-OpenGNM/opengnm.git
          git -C opengnm checkout --detach 4b295ca54c82c83acf308d1c646a2dfa9ae57350
          git clone -q --filter=blob:none https://github.com/KhronosGroup/Vulkan-Headers.git
          git -C Vulkan-Headers checkout --detach 9fbc2a782ee3f8a4db64e7d991e23da75e893f44
          git clone -q --filter=blob:none https://github.com/KhronosGroup/SPIRV-Headers.git
          git -C SPIRV-Headers checkout --detach fef168c54ed2e37c314eb251806aaf9877f38465
          test "$(git -C opengnm-psbc rev-parse HEAD)" = 28697f007862427ebec54388ec972ce6e3545912
          test "$(git -C opengnm rev-parse HEAD)" = 4b295ca54c82c83acf308d1c646a2dfa9ae57350
          echo 'KAZUMA186_PSBC_SOURCE=PINNED_4_PUBLIC_UPSTREAMS_NO_GAME'
      - name: Gerar codigo Mesa/NIR/ACO e compilar PSBC real para Orbis
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/shaders/opengnm-psbc"
          export OO_PS4_TOOLCHAIN="$PS4SDK"
          # Dependencies include generated tables; all codegen runs on the host.
          timeout 300s make -j2 -f Makefile.orbis generated
          test -s src/compiler/nir/nir_opcodes.h
          test -s src/amd/compiler/aco_opcodes.h
          # Mesa's vendored Makefile omits three generated format files.
          # Generate them using its own unmodified upstream generator.
          python3 src/util/format/u_format_table.py src/util/format/u_format.yaml --enums \
            > src/util/format/u_format_gen.h
          python3 src/util/format/u_format_table.py src/util/format/u_format.yaml --header \
            > src/util/format/u_format_pack.h
          python3 src/util/format/u_format_table.py src/util/format/u_format.yaml \
            > src/util/format/u_format_table.c
          test -s src/util/format/u_format_gen.h
          test -s src/util/format/u_format_pack.h
          test -s src/util/format/u_format_table.c
          echo 'KAZUMA186_MESA_FORMAT_GENERATORS=THREE_REQUIRED_OUTPUTS_CREATED'
          python3 src/util/process_shader_stats.py \
            src/util/shader_stats.rnc src/util/shader_stats.xml \
            > src/util/shader_stats.h
          test -s src/util/shader_stats.h
          echo 'KAZUMA186_MESA_SHADER_STATS_HEADER=GENERATED_FROM_UPSTREAM_XML'
          python3 src/compiler/builtin_types_h.py src/compiler/builtin_types.h
          python3 src/compiler/builtin_types_c.py src/compiler/builtin_types.c
          test -s src/compiler/builtin_types.h
          test -s src/compiler/builtin_types.c
          echo 'KAZUMA186_MESA_BUILTIN_TYPES=GENERATED_AND_READY_FOR_COMPILATION'
          python3 src/vulkan/util/vk_struct_type_cast_gen.py \
            --xml ../Vulkan-Headers/registry/vk.xml --beta false \
            --out src/vulkan/util/vk_struct_type_cast.h
          test -s src/vulkan/util/vk_struct_type_cast.h
          echo 'KAZUMA186_VULKAN_STRUCT_CAST=GENERATED_FROM_PINNED_VK_XML'
          packet_src=(
            src/amd/packets/cp_pm4_table_data_gfx11.json
            src/amd/packets/pm4_it_opcodes_gfx11.h
            src/amd/packets/cp_pm4_table_data_gfx12.json
            src/amd/packets/pm4_it_opcodes_gfx12.h
          )
          for gen in gfx11 gfx12; do
            python3 src/amd/packets/parse_cp_pm4_table_data_json.py \
              "${packet_src[@]}" "$gen" packets_h \
              > "src/amd/common/amd_cp_packets_$gen.h"
            test -s "src/amd/common/amd_cp_packets_$gen.h"
          done
          echo 'KAZUMA186_AMD_GFX11_12_PACKET_HEADERS=GENERATED_FROM_VENDOR_JSON'
          # Compile the actual shader frontend before the full Mesa library.
          timeout 180s make -j2 -f Makefile.orbis \
            CC=clang-18 CXX=clang++-18 AR=llvm-ar-18 \
            libpsbc/psbc_compile.orbis.o
          echo 'KAZUMA186_REAL_SPIRV_TO_GCN_FRONTEND=COMPILED_PS4_NOT_EXECUTED'
          # Strict ceiling keeps runners from looping on missing dependencies.
          timeout --signal=TERM --kill-after=20s 1400s \
            make -j2 -f Makefile.orbis \
            CC=clang-18 CXX=clang++-18 AR=llvm-ar-18
          test -s libpsbc.orbis.a
          count="$(llvm-ar-18 t libpsbc.orbis.a | wc -l)"
          test "$count" -ge 300
          printf 'KAZUMA186_REAL_PSBC_ORBIS_ARCHIVE_OBJECTS=%s\n' "$count"
          # Link relocatably to ensure all compiler objects use PS4 architecture.
          ld.lld-18 -m elf_x86_64 -r -o "$RUNNER_TEMP/psbc-compiler-real.o" \
            --whole-archive libpsbc.orbis.a --no-whole-archive
          readelf -h "$RUNNER_TEMP/psbc-compiler-real.o" | grep -E 'Class:|Machine:'
          llvm-nm-18 --defined-only "$RUNNER_TEMP/psbc-compiler-real.o" \
            > "$RUNNER_TEMP/psbc-compiler-symbols.txt"
          grep -E -m 3 ' [Tt] psbc_(init|compile_shader|shutdown)' \
            "$RUNNER_TEMP/psbc-compiler-symbols.txt"
          echo 'KAZUMA186_REAL_PSBC_ORBIS_LINK=PASSED_NO_GPU_EXECUTION_NO_GAME'
      - name: Ativar compilacao de shaders no driver Vulkan e vincular ao OpenGNM
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/shaders"
          sdk="$PS4SDK"
          cd "$root"
          git clone -q --filter=blob:none https://github.com/PS4-OpenGNM/vulkan-ps4.git
          git -C vulkan-ps4 checkout --detach f4d940b723771b3fe637e8ac0704bb5d6ab19622
          cp opengnm/config.orbis.mak opengnm/config.mak
          make -C opengnm -f Makefile lib OO_PS4_TOOLCHAIN="$sdk" \
            CC=clang-18 AR=llvm-ar-18
          test -s opengnm/libopengnm.a
          mkdir -p "$RUNNER_TEMP/psbc-driver-objects"
          driver="$root/vulkan-ps4"
          sources=(
            vk_ps4_entry vk_ps4_dispatch vk_ps4_entrypoints vk_ps4_instance
            vk_ps4_device vk_ps4_format vk_ps4_memory vk_ps4_buffer
            vk_ps4_image vk_ps4_render_pass vk_ps4_shader vk_ps4_pipeline
            vk_ps4_descriptor vk_ps4_command vk_ps4_swapchain vk_ps4_queue
            vk_ps4_sync vk_ps4_query vk_ps4_stubs vk_ps4_vulkan11 vk_ps4_log
          )
          for base in "${sources[@]}"; do
            clang-18 --target=x86_64-pc-freebsd12-elf -std=c11 -O0 -g0 -fPIC \
              -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE \
              -DORBIS -D__ORBIS__ -D__PS4__ -DVK_USE_PLATFORM_PS4 \
              -DVK_PS4_HAVE_PSBC=1 \
              -isysroot "$sdk" -isystem "$sdk/include" \
              -I"$driver/include" -I"$root/Vulkan-Headers/include" \
              -I"$root/opengnm/include" -I"$root/opengnm-psbc/libpsbc" \
              -I"$root/opengnm-psbc/include" \
              -c "$driver/src/$base.c" \
              -o "$RUNNER_TEMP/psbc-driver-objects/$base.o"
          done
          llvm-ar-18 rcs "$RUNNER_TEMP/libvulkan_ps4_shader_enabled.a" \
            "$RUNNER_TEMP/psbc-driver-objects/"*.o
          test "$(llvm-ar-18 t "$RUNNER_TEMP/libvulkan_ps4_shader_enabled.a" | wc -l)" -eq 21
          ld.lld-18 -m elf_x86_64 -r \
            -o "$RUNNER_TEMP/psbc-vulkan-opengnm-all.o" \
            --whole-archive "$RUNNER_TEMP/libvulkan_ps4_shader_enabled.a" \
              "$root/opengnm/libopengnm.a" \
              "$root/opengnm-psbc/libpsbc.orbis.a" \
            --no-whole-archive
          readelf -h "$RUNNER_TEMP/psbc-vulkan-opengnm-all.o" | grep -E 'Class:|Machine:'
          llvm-nm-18 --defined-only "$RUNNER_TEMP/psbc-vulkan-opengnm-all.o" \
            > "$RUNNER_TEMP/all-graphics-defined.txt"
          for symbol in vk_ps4_CreateShaderModule psbc_compile_shader sceGnmCmdInit; do
            grep -F "$symbol" "$RUNNER_TEMP/all-graphics-defined.txt"
          done
          echo 'KAZUMA187_SHADER_ENABLED_VULKAN_OPENGNM_PSBC=RELOCATABLE_LINK_SUCCESS_NO_HARDWARE'

