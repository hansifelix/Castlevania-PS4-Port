name: Kazuma Etapa 88 - Runtime real call/unimpl ABI (sem ROM, sem PKG)
on:
  push:
    paths:
      - 'tools/etapa88/**'
      - '.github/workflows/kazuma-etapa88-loader-abi.yml'
  pull_request:
    paths:
      - 'tools/etapa88/**'
      - 'docs/KAZUMA_ETAPA88.md'
      - '.github/workflows/kazuma-etapa88-loader-abi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolver-abi-loader-publico:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout do port (sem codigo do jogo)
        uses: actions/checkout@v4
      - name: Clang / linker / Git
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang-18 llvm-18 lld-18 git curl ca-certificates
      - name: OpenOrbis fixado e fonte pública do runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk" "$RUNNER_TEMP/private_build" reports/etapa88
          curl -fLsS --retry 3 --retry-delay 3 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o "$RUNNER_TEMP/openorbis.tar.gz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/openorbis.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/openorbis.tar.gz" -C "$RUNNER_TEMP/sdk"
          sdk_link="$(find "$RUNNER_TEMP/sdk" -type f -name link.x -print -quit)"
          test -s "$sdk_link"
          echo "OO_PS4_TOOLCHAIN=$(dirname "$sdk_link")" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --sparse https://github.com/SwonDev/cstlvnia-blmont-to-macos.git "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" checkout -q --detach 4043f21bb4f656d34cd17ba070238c7728d00631
          git -C "$RUNNER_TEMP/upstream" sparse-checkout set runtime/src runtime/include/nx
          test -s "$RUNNER_TEMP/upstream/runtime/src/loader.cpp"
          echo "KAZUMA_NX_SOURCE=$RUNNER_TEMP/upstream" >> "$GITHUB_ENV"
      - name: Shim de bit_cast/rotr do cpu.h (somente no runner)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compat/nx"
          cat > "$RUNNER_TEMP/compat/nx/kazuma_cpu_compat.h" <<'CPP'
          #pragma once
          #include <cstdint>
          #include <type_traits>
          namespace kazuma_cpu_compat {
          template <typename To, typename From>
          constexpr To bit_cast(const From& from) noexcept {
              static_assert(sizeof(To) == sizeof(From));
              static_assert(std::is_trivially_copyable_v<To> && std::is_trivially_copyable_v<From>);
              return __builtin_bit_cast(To, from);
          }
          template <typename T>
          constexpr T rotr(T value, int shift) noexcept {
              static_assert(std::is_unsigned_v<T>);
              constexpr int bits = int(sizeof(T) * 8);
              int n = ((shift % bits) + bits) % bits;
              return n ? T((value >> n) | (value << (bits - n))) : value;
          }
          }
          CPP
          python3 - <<'PY'
          from pathlib import Path
          import os
          src=Path(os.environ['KAZUMA_NX_SOURCE']) / 'runtime/include/nx/cpu.h'
          s=src.read_text(encoding='utf-8')
          assert s.count('#include <bit>')==1 and 'std::bit_cast' in s and 'std::rotr(' in s
          s=s.replace('#include <bit>', '#include "kazuma_cpu_compat.h"')
          s=s.replace('std::bit_cast','kazuma_cpu_compat::bit_cast')
          s=s.replace('std::rotr(','kazuma_cpu_compat::rotr(')
          Path(os.environ['RUNNER_TEMP'],'compat/nx/cpu.h').write_text(s,encoding='utf-8')
          PY
      - name: Compilar o loader upstream verdadeiro + probe sintético para PS4
        run: |
          set -euo pipefail
          sdk="$OO_PS4_TOOLCHAIN"
          up="$KAZUMA_NX_SOURCE"
          out="$RUNNER_TEMP/private_build"
          flags=(
            --target=x86_64-pc-freebsd12-elf -std=c++20 -O0 -fPIC
            -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE
            -isysroot "$sdk" -isystem "$sdk/include" -isystem "$sdk/include/c++/v1"
            -I"$RUNNER_TEMP/compat" -I"$up/runtime/include" -I"$up/runtime/src"
          )
          clang++-18 "${flags[@]}" -c "$up/runtime/src/loader.cpp" -o "$out/loader.o" \
            2> reports/etapa88/LOADER_COMPILE.log
          clang++-18 "${flags[@]}" -c tools/etapa88/runtime_abi_probe.cpp -o "$out/probe.o" \
            2> reports/etapa88/PROBE_COMPILE.log
          llvm-nm-18 -C --defined-only "$out/loader.o" > reports/etapa88/LOADER_DEFINED.nm
          llvm-nm-18 -C -u "$out/probe.o" > reports/etapa88/PROBE_UNDEFINED.nm
          grep -Fq 'nx::call(nx::CPU&, unsigned long)' reports/etapa88/LOADER_DEFINED.nm
          grep -Fq 'nx::unimpl(nx::CPU&, unsigned long, char const*)' reports/etapa88/LOADER_DEFINED.nm
          grep -Fq 'nx::call(nx::CPU&, unsigned long)' reports/etapa88/PROBE_UNDEFINED.nm
          grep -Fq 'nx::unimpl(nx::CPU&, unsigned long, char const*)' reports/etapa88/PROBE_UNDEFINED.nm
          ld.lld-18 -m elf_x86_64 -r -o "$out/loader_plus_probe.o" "$out/loader.o" "$out/probe.o"
          llvm-nm-18 -C -u "$out/loader_plus_probe.o" > reports/etapa88/POST_LINK_UNDEFINED.nm
          if grep -Eq 'nx::(call|unimpl)\(' reports/etapa88/POST_LINK_UNDEFINED.nm; then
            echo 'FAIL: call/unimpl seguem indefinidos mesmo após link com loader real'
            exit 1
          fi
          printf 'UPSTREAM_SHA=4043f21bb4f656d34cd17ba070238c7728d00631\nOPENORBIS=v0.5.4\nCLANG=18\nLOADER_COMPILED=YES\nPROBE_COMPILED=YES\nPARTIAL_LINK=YES\nNX_CALL_RESOLVED=YES\nNX_UNIMPL_RESOLVED=YES\nREAL_AOT_INCLUDED=NO\nSTRICT_LINK=NO\nEBOOT=NO\nPKG=NO\n' > reports/etapa88/STATUS.txt
          echo 'Loader real e probe sintético vinculados: as duas assinaturas se resolveram.'
      - name: Publicar apenas diagnóstico público (sem binário)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kazuma88-runtime-abi-public-only
          path: reports/etapa88/
          retention-days: 14
          if-no-files-found: warn
