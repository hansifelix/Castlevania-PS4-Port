name: 'Kazuma Etapa 43 - baseline ELF PS4 e provedores C++ (SEM PKG)'
on:
  pull_request:
    paths:
      - '.github/workflows/kazuma-etapa43-baseline.yml'
      - 'tools/etapa43/**'
      - 'docs/KAZUMA_BRANDING_PORT_PS4.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corrigir-baseline-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
      - name: Instalar ferramentas versionadas
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 lld-18 binutils python3 curl ca-certificates
      - name: Obter SDK OpenOrbis verificado
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk" "$RUNNER_TEMP/download"
          curl -fLsS --retry 3 --retry-delay 3 \
            'https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz' \
            -o "$RUNNER_TEMP/download/openorbis.tar.gz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/download/openorbis.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/download/openorbis.tar.gz" -C "$RUNNER_TEMP/sdk"
          sdk_link="$(find "$RUNNER_TEMP/sdk" -type f -name link.x -print -quit)"
          test -n "$sdk_link"
          echo "OO_PS4_TOOLCHAIN=$(dirname "$sdk_link")" >> "$GITHUB_ENV"
      - name: Testar baseline sem falsear link
        run: |
          set -euo pipefail
          bash tools/etapa43/testar_baseline.sh
      - name: Publicar apenas diagnosticos (sem executavel)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kazuma-etapa43-baseline-openorbis-sem-pkg
          path: |
            relatorios/etapa43/
            relatorios/etapa10/
          if-no-files-found: warn
          retention-days: 20
