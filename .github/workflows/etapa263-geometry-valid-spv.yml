name: Etapa 263 — Geometry SPIR-V válido, fail-closed

on:
  pull_request:
    paths:
      - "tests/geometry_valid_rejected.cpp"
      - "tests/test_geometry_valid_spirv_failclosed.py"
      - "tools/link/patch_unsupported_shader_stage_failclosed.py"
      - ".github/workflows/etapa263-geometry-valid-spv.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-valid-rejected:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install only host test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools clang-18 git
      - name: Fetch exact pinned upstream source
        env:
          PIN: 4043f21bb4f656d34cd17ba070238c7728d00631
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/SwonDev/cstlvnia-blmont-to-macos.git "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" checkout --detach "$PIN"
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)" = "$PIN"
      - name: Validate a real synthetic Geometry module and fail-closed reflection
        run: |
          python3 tests/test_geometry_valid_spirv_failclosed.py "$RUNNER_TEMP/upstream"
