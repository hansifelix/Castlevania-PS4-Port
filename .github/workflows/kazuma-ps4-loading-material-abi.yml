name: 'Kazuma PS4 - callback material de carregamento (ABI real, sem jogo)'
on:
  pull_request:
    paths:
      - 'src/ps4/castlevania_loading_material.cpp'
      - '.github/workflows/kazuma-ps4-loading-material-abi.yml'
  push:
    branches: [main]
    paths:
      - 'src/ps4/castlevania_loading_material.cpp'
      - '.github/workflows/kazuma-ps4-loading-material-abi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compilar-callback:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Preparar ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 lld-18 binutils git curl ca-certificates
      - name: Obter OpenOrbis e runtime original MIT (hash fixados)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk"
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz' \
            -o "$RUNNER_TEMP/openorbis.tar.gz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/openorbis.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/openorbis.tar.gz" -C "$RUNNER_TEMP/sdk"
          sdk_link="$(find "$RUNNER_TEMP/sdk" -name link.x -type f -print -quit)"
          test -n "$sdk_link"
          echo "OO_PS4_TOOLCHAIN=$(dirname "$sdk_link")" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --sparse \
            https://github.com/SwonDev/cstlvnia-blmont-to-macos.git "$RUNNER_TEMP/nx-src"
          git -C "$RUNNER_TEMP/nx-src" checkout -q --detach \
            4043f21bb4f656d34cd17ba070238c7728d00631
          git -C "$RUNNER_TEMP/nx-src" sparse-checkout set runtime/src runtime/include/nx
          test -s "$RUNNER_TEMP/nx-src/runtime/include/nx/runtime.h"
          echo "KAZUMA_NX_SOURCE=$RUNNER_TEMP/nx-src" >> "$GITHUB_ENV"
      - name: Compilar callback com ABI real e auditar simbolos
        shell: bash
        run: |
          set -euo pipefail
          sdk="$OO_PS4_TOOLCHAIN"
          src="$KAZUMA_NX_SOURCE"
          mkdir -p build/loading-material
          clang++-18 --target=x86_64-pc-freebsd12-elf -std=c++20 -O1 -fPIC \
            -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE \
            -isysroot "$sdk" -isystem "$sdk/include" -isystem "$sdk/include/c++/v1" \
            -I"$src/runtime/include" -I"$src/runtime/src" \
            -c src/ps4/castlevania_loading_material.cpp \
            -o build/loading-material/callback.o
          test -s build/loading-material/callback.o
          readelf -h build/loading-material/callback.o | grep -q 'REL (Relocatable file)'
          llvm-nm-18 -C --defined-only build/loading-material/callback.o > build/loading-material/defined.txt
          llvm-nm-18 -C --undefined-only build/loading-material/callback.o > build/loading-material/undefined.txt
          grep -Fq 'nx_castlevania_loading_material(nx::CPU&, void (*)(nx::CPU&))' build/loading-material/defined.txt
          grep -Fq 'nx::call(nx::CPU&, unsigned long)' build/loading-material/undefined.txt
          grep -Fq 'nx::fatal(char const*, ...)' build/loading-material/undefined.txt
          sha256sum build/loading-material/callback.o > build/loading-material/SHA256.txt
          echo 'PASS: real loading callback compiled against pinned nx/runtime.h (no game)'
      - name: Publicar auditoria textual
        uses: actions/upload-artifact@v4
        with:
          name: kazuma-loading-material-abi-sem-jogo
          path: |
            build/loading-material/defined.txt
            build/loading-material/undefined.txt
            build/loading-material/SHA256.txt
          if-no-files-found: error
          retention-days: 7
