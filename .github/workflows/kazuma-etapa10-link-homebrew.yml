name: "Kazuma - Etapa 10: ELF minimo independente no OpenOrbis (SEM JOGO)"

on:
  pull_request:
    paths:
      - '.github/workflows/kazuma-etapa10-link-homebrew.yml'
      - 'tools/etapa10/**'
      - 'docs/KAZUMA_ETAPA10_ELF_MINIMO.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-homebrew:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Obter repositorio Kazuma
        uses: actions/checkout@v4
      - name: Instalar ferramentas
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld binutils curl ca-certificates python3
      - name: Obter OpenOrbis v0.5.4 com SHA256 verificado
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk-bundle" "$RUNNER_TEMP/sdk"
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz' \
            -o "$RUNNER_TEMP/sdk-bundle/openorbis.tar.gz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/sdk-bundle/openorbis.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/sdk-bundle/openorbis.tar.gz" -C "$RUNNER_TEMP/sdk"
          sdk_link="$(find "$RUNNER_TEMP/sdk" -type f -name link.x -print -quit)"
          test -n "$sdk_link"
          sdk="$(dirname "$sdk_link")"
          test -s "$sdk/lib/crt1.o"
          echo "OO_PS4_TOOLCHAIN=$sdk" >> "$GITHUB_ENV"
      - name: Compilar e ligar ELF homebrew independente (nao eboot)
        run: |
          set -euo pipefail
          bash tools/etapa10/testar_link_homebrew.sh "$OO_PS4_TOOLCHAIN" 2>&1 | tee etapa10_execucao.txt
          test -s relatorios/etapa10/resumo.json
      - name: Publicar SOMENTE diagnosticos, sem binarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kazuma-etapa10-relatorio-elf-minimo-SEM-JOGO
          path: |
            etapa10_execucao.txt
            relatorios/etapa10/
          if-no-files-found: warn
          retention-days: 21
