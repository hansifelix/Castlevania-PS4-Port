name: Lingshu - Compilar objeto PS4 da ponte nativa (SEM JOGO)
on:
  pull_request:
    paths:
      - '.github/workflows/lingshu-ps4-object-check.yml'
      - 'tools/lingshu-native-ps4/native_reserve_policy.h'
      - 'tools/lingshu-native-ps4/native_reserve_ps4_bridge.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ps4-object:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Clang e obter SDK OpenOrbis publico fixado
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 binutils curl ca-certificates
          mkdir -p "$RUNNER_TEMP/sdk" "$RUNNER_TEMP/download"
          curl -fLsS --retry 3 --retry-delay 3 \
            'https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz' \
            -o "$RUNNER_TEMP/download/sdk.tar.gz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/download/sdk.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/download/sdk.tar.gz" -C "$RUNNER_TEMP/sdk"
          sdk_link="$(find "$RUNNER_TEMP/sdk" -type f -name link.x -print -quit)"
          test -n "$sdk_link"
          echo "OO_PS4_TOOLCHAIN=$(dirname "$sdk_link")" >> "$GITHUB_ENV"
      - name: Compilar ponte C++ para alvo x86-64 PS4
        shell: bash
        run: |
          set -euo pipefail
          sdk="$OO_PS4_TOOLCHAIN"
          clang++-18 --target=x86_64-pc-freebsd12-elf \
            -std=c++20 -O1 -fPIC -Wall -Wextra -Werror \
            -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE \
            -isysroot "$sdk" -isystem "$sdk/include" \
            -isystem "$sdk/include/c++/v1" \
            -Itools/lingshu-native-ps4 \
            -c tools/lingshu-native-ps4/native_reserve_ps4_bridge.cpp \
            -o "$RUNNER_TEMP/lingshu-native-ps4.o"
          readelf -h "$RUNNER_TEMP/lingshu-native-ps4.o" | tee "$RUNNER_TEMP/object-header.txt"
          grep -q 'Advanced Micro Devices X86-64' "$RUNNER_TEMP/object-header.txt"
          echo 'LINGSHU_NATIVE_PS4_OBJECT=COMPILED_NOT_LINKED_NOT_EBOOT_NOT_PKG'
