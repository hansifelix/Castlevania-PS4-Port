name: 'Kazuma Etapa 69 - Elefante Runner X/pulo PS4 (homebrew sem jogo)'
on:
  pull_request:
    paths:
      - '.github/workflows/kazuma-etapa69-elefante-runner.yml'
      - 'tools/etapa69/**'
      - 'tools/etapa68/**'
      - 'tools/etapa67/**'
      - 'tools/etapa62/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  elefante:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Compiladores host e shaders Vulkan
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang lld llvm glslang-tools binutils curl ca-certificates python3 gcc
      - name: Testar fisica do pulo e transformacao do renderizador
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror \
            tools/etapa69/gameplay.c tools/etapa69/test_gameplay.c \
            -o "$RUNNER_TEMP/kazuma69-test"
          "$RUNNER_TEMP/kazuma69-test"
          python3 -m unittest discover -s tools/etapa69 -p 'test_*.py' -v
      - name: Obter SDK fixado e Mesa RADV utilizados na Etapa 68.1
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk"
          curl -fLsS --retry 3 --retry-delay 4 \
            'https://github.com/orbis-ports/orbis-porting-kit/releases/download/orbis-sdk-v1/orbis-sdk-v1.tar.gz' \
            -o "$RUNNER_TEMP/orbis-sdk-v1.tar.gz"
          echo "f4f079a4df334b46a76996f895283904283d6a006f97102aafaa53d4ecfc9622  $RUNNER_TEMP/orbis-sdk-v1.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/orbis-sdk-v1.tar.gz" -C "$RUNNER_TEMP/sdk"
          echo "KAZUMA69_BUNDLE=$RUNNER_TEMP/sdk/orbis-sdk-v1" >> "$GITHUB_ENV"
      - name: Compilar o elefante e shaders nativos para o PS4
        run: |
          set -euo pipefail
          mkdir -p relatorios/etapa69
          cmake -S tools/etapa69 -B "$RUNNER_TEMP/kazuma69-build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$KAZUMA69_BUNDLE/toolchain/orbis-sdk.cmake" \
            -DCMAKE_AR="$(command -v llvm-ar)" \
            -DCMAKE_RANLIB="$(command -v llvm-ranlib)" \
            -DCMAKE_MAKE_PROGRAM="$(command -v ninja)" \
            > relatorios/etapa69/CONFIGURAR.log 2>&1 || { tail -n 120 relatorios/etapa69/CONFIGURAR.log; exit 1; }
          cmake --build "$RUNNER_TEMP/kazuma69-build" \
            > relatorios/etapa69/COMPILAR.log 2>&1 || { tail -n 120 relatorios/etapa69/COMPILAR.log; exit 1; }
          eboot="$(find "$RUNNER_TEMP/kazuma69-build" -type f -name eboot.bin -print -quit)"
          test -n "$eboot" && test -s "$eboot"
          cp "$eboot" relatorios/etapa69/eboot.bin
          sha256sum relatorios/etapa69/eboot.bin > relatorios/etapa69/SHA256_EBOOT.txt
      - name: Empacotar demo Elephant Runner sem conteudo comercial
        run: |
          set -euo pipefail
          . "$KAZUMA69_BUNDLE/env.sh"
          prx_dir="$OO_PS4_TOOLCHAIN/src/modules"
          mkdir -p "$prx_dir"
          upstream='0a1aaf9dd4a92695538bdeb09fb056d06dd11725'
          base="https://raw.githubusercontent.com/OpenOrbis/OpenOrbis-PS4-Toolchain/$upstream/samples/piglet/sce_module"
          curl -fLsS --retry 3 "$base/libSceFios2.prx" -o "$prx_dir/libSceFios2.prx"
          curl -fLsS --retry 3 "$base/libc.prx" -o "$prx_dir/libc.prx"
          test "$(git hash-object "$prx_dir/libSceFios2.prx")" = '1f83bdc8f1fd0ddf6a56f0d5faa1d914e35095fa'
          test "$(git hash-object "$prx_dir/libc.prx")" = 'e49b25d011281d52131a34d5a18106dd49605919'
          "$KAZUMA69_BUNDLE/orbis-compat/scripts/ps4/make-pkg.sh" \
            --eboot "$GITHUB_WORKSPACE/relatorios/etapa69/eboot.bin" \
            --out-dir "$GITHUB_WORKSPACE/relatorios/etapa69/pkg" \
            --title-id BREW91269 \
            --title 'Kazuma Elefante Runner 69' \
            --icon "$GITHUB_WORKSPACE/tools/etapa12/assets/icon0.png" \
            > relatorios/etapa69/EMPACOTAR.log 2>&1 || { tail -n 120 relatorios/etapa69/EMPACOTAR.log; exit 1; }
          pkg="$(find relatorios/etapa69/pkg -type f -name '*.pkg' -print -quit)"
          test -n "$pkg" && test -s "$pkg"
          sha256sum "$pkg" > relatorios/etapa69/SHA256_PKG.txt
          echo 'Kazuma69 demo experimental; X pula se libScePad puder abrir o DualShock 4. Nao ha Castlevania nem codigo de gameplay original.' > relatorios/etapa69/LEIA_PRIMEIRO.txt
      - name: Artefato PKG e relatorios (CI nao testa o controle PS4)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kazuma69-elefante-runner-x-pulo-ps4
          path: relatorios/etapa69/
          retention-days: 14
