name: 'Kazuma PS4 - VideoOut antes de nnMain (ABI real, sem jogo)'
on:
  pull_request:
    paths:
      - 'src/ps4/castlevania_game_ps4.cpp'
      - 'src/ps4/castlevania_resolution.hpp'
      - '.github/workflows/kazuma-ps4-game-videoout-abi.yml'
  push:
    branches: [main]
    paths:
      - 'src/ps4/castlevania_game_ps4.cpp'
      - '.github/workflows/kazuma-ps4-game-videoout-abi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compilar-game-hook:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compiladores
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 binutils curl ca-certificates git
      - name: SDK OpenOrbis e runtime MIT fixados
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk"
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz' \
            -o "$RUNNER_TEMP/openorbis.tar.gz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/openorbis.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/openorbis.tar.gz" -C "$RUNNER_TEMP/sdk"
          sdk_link="$(find "$RUNNER_TEMP/sdk" -name link.x -type f -print -quit)"
          test -n "$sdk_link"
          echo "OO_PS4_TOOLCHAIN=$(dirname "$sdk_link")" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --sparse \
            https://github.com/SwonDev/cstlvnia-blmont-to-macos.git "$RUNNER_TEMP/nx-src"
          git -C "$RUNNER_TEMP/nx-src" checkout -q --detach \
            4043f21bb4f656d34cd17ba070238c7728d00631
          git -C "$RUNNER_TEMP/nx-src" sparse-checkout set runtime/src runtime/include/nx
          test -s "$RUNNER_TEMP/nx-src/runtime/include/nx/game.h"
          echo "KAZUMA_NX_SOURCE=$RUNNER_TEMP/nx-src" >> "$GITHUB_ENV"
      - name: Compilar provider PS4 contra headers REAIS
        shell: bash
        run: |
          set -euo pipefail
          sdk="$OO_PS4_TOOLCHAIN"
          src="$KAZUMA_NX_SOURCE"
          mkdir -p build/ps4-videoout-gate
          clang++-18 --target=x86_64-pc-freebsd12-elf -std=c++20 -O1 -fPIC \
            -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE \
            -isysroot "$sdk" -isystem "$sdk/include" -isystem "$sdk/include/c++/v1" \
            -I"$src/runtime/include" -I"$src/runtime/src" -Isrc/ps4 \
            -c src/ps4/castlevania_game_ps4.cpp \
            -o build/ps4-videoout-gate/game_ps4.o
          file build/ps4-videoout-gate/game_ps4.o
          llvm-nm-18 -C --defined-only build/ps4-videoout-gate/game_ps4.o > build/ps4-videoout-gate/defined.txt
          llvm-nm-18 -C --undefined-only build/ps4-videoout-gate/game_ps4.o > build/ps4-videoout-gate/undefined.txt
          grep -Fq 'nx::game::after_init()' build/ps4-videoout-gate/defined.txt
          grep -Fq 'nx::game::kInfo' build/ps4-videoout-gate/defined.txt
          grep -Fq 'nx::plat::screen_size(unsigned int&, unsigned int&)' build/ps4-videoout-gate/undefined.txt
          grep -Fq 'kazuma::ps4::video::configure_native(unsigned int, unsigned int)' build/ps4-videoout-gate/undefined.txt
          echo 'ABI PS4: provider compilado; VideoOut e resolution ainda exigem link completo.'
      - name: Publicar somente logs de ABI, nunca binarios de jogo
        uses: actions/upload-artifact@v4
        with:
          name: kazuma-videoout-game-hook-abi-sem-jogo
          path: |
            build/ps4-videoout-gate/defined.txt
            build/ps4-videoout-gate/undefined.txt
          if-no-files-found: error
          retention-days: 7
