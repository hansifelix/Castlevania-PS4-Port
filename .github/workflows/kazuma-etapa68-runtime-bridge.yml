name: 'Kazuma Etapa 68 - ponte real nx::plat Vulkan com apresentacao PS4 (sem jogo)'
on:
  pull_request:
    paths:
      - '.github/workflows/kazuma-etapa68-runtime-bridge.yml'
      - 'tools/etapa68/**'
      - 'tools/etapa67/**'
      - 'tools/etapa62/ps4_vulkan_bridge.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ps4-runtime-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Compiladores Vulkan / OpenOrbis
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang lld llvm glslang-tools binutils curl ca-certificates python3
      - name: Bundle SDK/Mesa RADV verificado da etapa 67
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk"
          curl -fLsS --retry 3 --retry-delay 4 \
            'https://github.com/orbis-ports/orbis-porting-kit/releases/download/orbis-sdk-v1/orbis-sdk-v1.tar.gz' \
            -o "$RUNNER_TEMP/orbis-sdk-v1.tar.gz"
          echo "f4f079a4df334b46a76996f895283904283d6a006f97102aafaa53d4ecfc9622  $RUNNER_TEMP/orbis-sdk-v1.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/orbis-sdk-v1.tar.gz" -C "$RUNNER_TEMP/sdk"
          export KAZUMA68_BUNDLE="$RUNNER_TEMP/sdk/orbis-sdk-v1"
          test -f "$KAZUMA68_BUNDLE/toolchain/orbis-sdk.cmake"
          test -f "$KAZUMA68_BUNDLE/orbis-compat/vkloader/CMakeLists.txt"
          test -f "$KAZUMA68_BUNDLE/mesa/build-orbis/src/amd/vulkan/libvulkan_radeon.a"
          echo "KAZUMA68_BUNDLE=$KAZUMA68_BUNDLE" >> "$GITHUB_ENV"
      - name: Preparar e validar a ponte da etapa 68
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/etapa68 -p 'test_*.py' -v
      - name: Compilar runtime bridge / RADV / WSI / apresentacao
        run: |
          set -euo pipefail
          mkdir -p relatorios/etapa68
          cmake -S tools/etapa68 -B "$RUNNER_TEMP/kazuma68-build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$KAZUMA68_BUNDLE/toolchain/orbis-sdk.cmake" \
            -DCMAKE_AR="$(command -v llvm-ar)" \
            -DCMAKE_RANLIB="$(command -v llvm-ranlib)" \
            -DCMAKE_MAKE_PROGRAM="$(command -v ninja)" \
            > relatorios/etapa68/CONFIGURAR.log 2>&1 || { tail -n 90 relatorios/etapa68/CONFIGURAR.log; exit 1; }
          cmake --build "$RUNNER_TEMP/kazuma68-build" \
            > relatorios/etapa68/COMPILAR.log 2>&1 || { tail -n 90 relatorios/etapa68/COMPILAR.log; exit 1; }
          eboot="$(find "$RUNNER_TEMP/kazuma68-build" -type f -name eboot.bin -print -quit)"
          test -n "$eboot" && test -s "$eboot" || { echo 'KAZUMA68: EBOOT_AUSENTE' >&2; exit 1; }
          cp "$eboot" relatorios/etapa68/eboot.bin
          sha256sum relatorios/etapa68/eboot.bin > relatorios/etapa68/SHA256_EBOOT.txt
          echo 'KAZUMA68: EBOOT_CRIADO; TESTE_HARDWARE_PENDENTE' | tee relatorios/etapa68/RESULTADO.txt
      - name: Empacotar homebrew independente
        run: |
          set -euo pipefail
          . "$KAZUMA68_BUNDLE/env.sh"
          prx_dir="$OO_PS4_TOOLCHAIN/src/modules"
          mkdir -p "$prx_dir"
          upstream='0a1aaf9dd4a92695538bdeb09fb056d06dd11725'
          base="https://raw.githubusercontent.com/OpenOrbis/OpenOrbis-PS4-Toolchain/$upstream/samples/piglet/sce_module"
          curl -fLsS --retry 3 "$base/libSceFios2.prx" -o "$prx_dir/libSceFios2.prx"
          curl -fLsS --retry 3 "$base/libc.prx" -o "$prx_dir/libc.prx"
          test "$(git hash-object "$prx_dir/libSceFios2.prx")" = '1f83bdc8f1fd0ddf6a56f0d5faa1d914e35095fa'
          test "$(git hash-object "$prx_dir/libc.prx")" = 'e49b25d011281d52131a34d5a18106dd49605919'
          test -s "$GITHUB_WORKSPACE/tools/etapa12/assets/icon0.png"
          "$KAZUMA68_BUNDLE/orbis-compat/scripts/ps4/make-pkg.sh" \
            --eboot "$GITHUB_WORKSPACE/relatorios/etapa68/eboot.bin" \
            --out-dir "$GITHUB_WORKSPACE/relatorios/etapa68/pkg" \
            --title-id BREW91268 \
            --title 'Kazuma Ponte Runtime Vulkan 68' \
            --icon "$GITHUB_WORKSPACE/tools/etapa12/assets/icon0.png" \
            > relatorios/etapa68/EMPACOTAR.log 2>&1 || { tail -n 90 relatorios/etapa68/EMPACOTAR.log; exit 1; }
          pkg="$(find relatorios/etapa68/pkg -type f -name '*.pkg' -print -quit)"
          test -n "$pkg" && test -s "$pkg" || { echo 'KAZUMA68: PKG_AUSENTE' >&2; exit 1; }
          sha256sum "$pkg" > relatorios/etapa68/SHA256_PKG.txt
          echo 'KAZUMA68: PKG_CRIADO; NAO_CONTEM_JOGO' | tee -a relatorios/etapa68/RESULTADO.txt
      - name: Salvar pacote e logs do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kazuma68-ponte-runtime-gpu-real-sem-jogo
          path: relatorios/etapa68/
          retention-days: 14
