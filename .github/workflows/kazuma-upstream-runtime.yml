name: Kazuma - runtime Castlevania real (sem jogo)

on:
  pull_request:
    paths:
      - '.github/workflows/kazuma-upstream-runtime.yml'
      - 'docs/KAZUMA_ETAPA4_RUNTIME_REAL.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obter apenas arquivos publicos do Kazuma Port Games
        uses: actions/checkout@v4

      - name: Instalar ferramentas nativas no Linux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libvulkan-dev

      - name: Obter codigo PUBLICO original do runtime (revisao fixa)
        run: |
          git clone --filter=blob:none https://github.com/SwonDev/cstlvnia-blmont-to-macos.git upstream
          git -C upstream checkout --detach 4043f21bb4f656d34cd17ba070238c7728d00631
          git -C upstream rev-parse HEAD | tee upstream_sha.txt
          test "$(cat upstream_sha.txt)" = '4043f21bb4f656d34cd17ba070238c7728d00631'

      - name: Configurar testes REAIS do runtime (sem qualquer codigo do jogo)
        run: |
          mkdir -p relatorios
          cmake -S upstream -B upstream-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DNX_BUILD_GAME=OFF -DNX_TESTS=ON \
            2>&1 | tee relatorios/configuracao.txt

      - name: Compilar quatro componentes originais do runtime
        run: |
          mkdir -p relatorios
          cmake --build upstream-build --parallel 2 --target \
            time_service_test thread_control_test audio_out_test weak_import_test \
            2>&1 | tee relatorios/compilacao.txt

      - name: Executar testes originais (sem assets, ROM ou NSO)
        run: |
          mkdir -p relatorios
          ctest --test-dir upstream-build --output-on-failure \
            -R '^(time_service|thread_control|audio_out|weak_import)$' \
            2>&1 | tee relatorios/testes.txt

      - name: Publicar relatorios mesmo que algum teste falhe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kazuma-etapa4-relatorios-runtime-real-sem-jogo
          path: |
            upstream_sha.txt
            relatorios/
            upstream-build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
