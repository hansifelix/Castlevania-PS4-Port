name: PS4 - PKG laboratorio (sem jogo)

on:
  pull_request:
    paths:
      - '.github/workflows/ps4-pkg-lab.yml'
      - 'ps4_hello/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ps4-pkg-lab.yml'
      - 'ps4_hello/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pkg:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Baixar codigo publico do projeto
        uses: actions/checkout@v4

      - name: Dependencias de compilacao e empacotamento
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld binutils curl ca-certificates python3 git dpkg-dev

      - name: Instalar SDK OpenOrbis 0.5.4 com SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sdk-bundle" "${RUNNER_TEMP}/sdk"
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz' \
            -o "${RUNNER_TEMP}/sdk-bundle/openorbis.tar.gz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"${RUNNER_TEMP}/sdk-bundle/openorbis.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/sdk-bundle/openorbis.tar.gz" -C "${RUNNER_TEMP}/sdk"
          sdk_link="$(find "${RUNNER_TEMP}/sdk" -name link.x -type f -print -quit)"
          if [[ -z "$sdk_link" ]]; then echo 'SDK sem link.x' >&2; exit 1; fi
          sdk="$(dirname "$sdk_link")"
          test -f "$sdk/lib/crt1.o"
          test -x "$sdk/bin/linux/create-fself"
          test -x "$sdk/bin/linux/create-gp4"
          test -x "$sdk/bin/linux/PkgTool.Core"
          echo "OO_PS4_TOOLCHAIN=$sdk" >> "$GITHUB_ENV"

      - name: Compilar eboot independente
        shell: bash
        run: |
          set -euo pipefail
          sdk="$OO_PS4_TOOLCHAIN"
          mkdir -p ps4_hello/build
          clang++ --target=x86_64-pc-freebsd12-elf \
            -fPIC -funwind-tables -fno-exceptions -c \
            -isysroot "$sdk" -isystem "$sdk/include" -isystem "$sdk/include/c++/v1" \
            ps4_hello/main.cpp -o ps4_hello/build/main.o
          ld.lld -m elf_x86_64 -pie --script "$sdk/link.x" --eh-frame-hdr \
            -L"$sdk/lib" ps4_hello/build/main.o \
            -o ps4_hello/build/hello.elf -lc -lkernel -lc++ "$sdk/lib/crt1.o"
          "$sdk/bin/linux/create-fself" \
            -in=ps4_hello/build/hello.elf \
            -out=ps4_hello/build/hello.oelf \
            --eboot ps4_hello/build/eboot.bin \
            --paid 0x3800000000000011
          test -s ps4_hello/build/eboot.bin

      - name: Obter empacotador documentado e fixado
        shell: bash
        run: |
          set -euo pipefail
          # Projeto do kit e arquivado. Referencia fixa (nunca HEAD variavel).
          git clone -q https://github.com/orbis-ports/orbis-porting-kit.git "${RUNNER_TEMP}/orbis-kit"
          cd "${RUNNER_TEMP}/orbis-kit"
          git checkout -q 213b0c38ff25ea7ca402c8844a6494086d0f1cae
          test -f scripts/ps4/make-pkg.sh
          test -f scripts/ps4/gen-icon0.py

      - name: Empacotar homebrew de teste (nao e Castlevania)
        shell: bash
        run: |
          set -euo pipefail
          kit="${RUNNER_TEMP}/orbis-kit"
          python3 "$kit/scripts/ps4/gen-icon0.py" \
            --out ps4_hello/build/icon0.png --title-id LABS10001
          mkdir -p ps4_hello/build/dist
          bash "$kit/scripts/ps4/make-pkg.sh" \
            --eboot "${GITHUB_WORKSPACE}/ps4_hello/build/eboot.bin" \
            --out-dir "${GITHUB_WORKSPACE}/ps4_hello/build/dist" \
            --title-id LABS10001 \
            --title 'PS4 - Teste tecnico (sem jogo)' \
            --version 01.00 \
            --content-label PS4LABTEST000001 \
            --icon "${GITHUB_WORKSPACE}/ps4_hello/build/icon0.png" \
            --sdk "$OO_PS4_TOOLCHAIN"
          find ps4_hello/build/dist -maxdepth 1 -name '*.pkg' -type f -size +0c -print
          test "$(find ps4_hello/build/dist -maxdepth 1 -name '*.pkg' -type f -size +0c | wc -l)" -ge 1

      - name: Publicar artefato PKG de teste
        uses: actions/upload-artifact@v4
        with:
          name: ps4-laboratorio-pkg-sem-jogo
          path: ps4_hello/build/dist/*.pkg
          if-no-files-found: error
          retention-days: 7

      - name: Publicar log do empacotador (se existir)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps4-laboratorio-logs-empacotamento
          path: ps4_hello/build/dist/pkg-stage/pkg-build.log
          if-no-files-found: ignore
          retention-days: 7
