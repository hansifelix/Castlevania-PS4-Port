name: "Kazuma - Etapa 17: teste seguro de paginas dinamicas PS4 (NAO TESTADO NO PS4)"
on:
  pull_request:
    paths:
      - '.github/workflows/kazuma-etapa17-arquivo.yml'
      - 'tools/etapa17/**'
      - 'docs/KAZUMA_ETAPA17_MEMORIA_PLAT_PS4.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compilar-homebrew-controle:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Kazuma
        uses: actions/checkout@v4
      - name: Instalar dependencias
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld binutils curl ca-certificates git python3
      - name: Preparar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Obter OpenOrbis v0.5.4 (hash fixo)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk-bundle" "$RUNNER_TEMP/sdk"
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz' \
            -o "$RUNNER_TEMP/sdk-bundle/openorbis.tar.gz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/sdk-bundle/openorbis.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/sdk-bundle/openorbis.tar.gz" -C "$RUNNER_TEMP/sdk"
          sdk_link="$(find "$RUNNER_TEMP/sdk" -type f -name link.x -print -quit)"
          test -n "$sdk_link"
          sdk="$(dirname "$sdk_link")"
          test -s "$sdk/lib/crt1.o"
          echo "OO_PS4_TOOLCHAIN=$sdk" >> "$GITHUB_ENV"
      - name: Obter helpers de video OpenOrbis (revisao fixa)
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --sparse https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git "$RUNNER_TEMP/openorbis-source"
          git -C "$RUNNER_TEMP/openorbis-source" checkout -q --detach 0a1aaf9dd4a92695538bdeb09fb056d06dd11725
          git -C "$RUNNER_TEMP/openorbis-source" sparse-checkout set samples/_common
          test -s "$RUNNER_TEMP/openorbis-source/samples/_common/graphics.cpp"
          echo "KAZUMA_OPENORBIS_SOURCE=$RUNNER_TEMP/openorbis-source" >> "$GITHUB_ENV"
      - name: Obter create-fself (revisao fixa)
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/OpenOrbis/create-fself.git "$RUNNER_TEMP/create-fself"
          git -C "$RUNNER_TEMP/create-fself" checkout -q --detach f2da6229684ce320f673c06fceac9c218f621788
          echo "KAZUMA_CREATE_FSELF=$RUNNER_TEMP/create-fself" >> "$GITHUB_ENV"
      - name: Obter fonte publica nx (revisao fixa, sem jogo)
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --sparse https://github.com/SwonDev/cstlvnia-blmont-to-macos.git "$RUNNER_TEMP/nx-source"
          git -C "$RUNNER_TEMP/nx-source" checkout -q --detach 4043f21bb4f656d34cd17ba070238c7728d00631
          git -C "$RUNNER_TEMP/nx-source" sparse-checkout set runtime/src
          test -s "$RUNNER_TEMP/nx-source/runtime/src/platform.h"
          test -s "$RUNNER_TEMP/nx-source/runtime/src/nvn/nvn_gpu_pick.cpp"
          echo "KAZUMA_NX_SOURCE=$RUNNER_TEMP/nx-source" >> "$GITHUB_ENV"
      - name: Compilar interface e gerar PKG independente Test 06
        run: |
          set -euo pipefail
          bash tools/etapa17/compilar_homebrew_pkg.sh \
            "$OO_PS4_TOOLCHAIN" "$KAZUMA_OPENORBIS_SOURCE" "$KAZUMA_CREATE_FSELF" "$KAZUMA_NX_SOURCE" \
            2>&1 | tee etapa17_execucao.txt
          test -s relatorios/etapa17/resumo.json
          python3 - <<'PY_CHECK'
          import json
          with open('relatorios/etapa17/resumo.json',encoding='utf-8') as f:r=json.load(f)
          assert r['etapa']==17
          assert r['teste_controle_no_ps4'] is False
          assert r['teste_memoria_no_ps4'] is False
          assert r['teste_funcao_nx_no_ps4'] is False
          assert r['teste_plat_pad_no_ps4'] is False
          assert r['teste_plat_relogio_no_ps4'] is False
          assert r['teste_plat_arquivo_no_ps4'] is False
          assert r['teste_mapeamento_dinamico_no_ps4'] is False
          assert r['nx_plat_reserve_commit_decommit_implementados'] is False
          print('Etapa17: somente build offline; mmap/mprotect/munmap aguardam teste PS4.')
          PY_CHECK
      - name: Publicar diagnosticos mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kazuma-etapa17-diagnosticos
          path: |
            etapa17_execucao.txt
            relatorios/etapa17/
          if-no-files-found: warn
          retention-days: 21
      - name: Publicar PKG somente apos build bem sucedido
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kazuma-etapa17-PKG-NAO-TESTADO
          path: release/etapa17/*.pkg
          if-no-files-found: error
          retention-days: 14
