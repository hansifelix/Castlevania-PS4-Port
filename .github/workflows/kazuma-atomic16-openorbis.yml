name: Kazuma - Atomic ABI 16-byte OpenOrbis proof (no game)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/etapa167/**'
      - 'tools/etapa172/**'
      - 'tools/etapa146/**'
      - 'tools/etapa175/**'
      - 'tools/etapa176/**'
      - '.github/workflows/kazuma-atomic16-openorbis.yml'
  push:
    branches: [main]
    paths:
      - 'tools/etapa167/**'
      - 'tools/etapa172/**'
      - 'tools/etapa146/**'
      - 'tools/etapa175/**'
      - 'tools/etapa176/**'
      - '.github/workflows/kazuma-atomic16-openorbis.yml'
permissions:
  contents: read
jobs:
  validar-libatomic-cx16:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Testar contrato exato dos sete AOT (somente arquivos sinteticos)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/etapa176 -p 'test_check_shards.py' -v
      - name: Testar o adaptador de memoria nativo com mmap e mprotect reais
        shell: bash
        run: |
          set -euo pipefail
          bash tools/etapa175/test_memory_host.sh
      - name: Instalar clang 18 e SDK OpenOrbis v0.5.4 (SHA fixado)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 lld-18 curl zstd
          mkdir -p "$RUNNER_TEMP/sdk" "$RUNNER_TEMP/download"
          curl -fLsS --retry 3 --retry-delay 3 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o "$RUNNER_TEMP/download/openorbis.tar.gz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/download/openorbis.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/download/openorbis.tar.gz" -C "$RUNNER_TEMP/sdk"
          sdk_link="$(find "$RUNNER_TEMP/sdk" -type f -name link.x -print -quit)"
          test -n "$sdk_link"
          echo "OO_PS4_TOOLCHAIN=$(dirname "$sdk_link")" >> "$GITHUB_ENV"
      - name: Exercitar a semantica do ABI 16 bytes no Linux (concorrencia real)
        shell: bash
        run: |
          set -euo pipefail
          for opt in 0 2; do
            clang++-18 -std=c++20 -O"$opt" -Wall -Wextra -Werror -pthread \
              tools/etapa167/atomic_abi_ps4.cpp tools/etapa167/test_atomic_abi_ps4.cpp \
              -o "$RUNNER_TEMP/atomic-host-$opt"
            "$RUNNER_TEMP/atomic-host-$opt"
            clang++-18 -std=c++20 -O"$opt" -Wall -Wextra -Werror -pthread \
              tools/etapa167/atomic_abi_ps4.cpp tools/etapa167/test_std_atomic16_integration.cpp \
              -o "$RUNNER_TEMP/atomic-integration-$opt"
            "$RUNNER_TEMP/atomic-integration-$opt"
          done
      - name: Compilar e vincular sonda real x86_64 OpenOrbis SEM libatomic
        shell: bash
        run: |
          set -euo pipefail
          sdk="$OO_PS4_TOOLCHAIN"
          cat > "$RUNNER_TEMP/probe.cpp" <<'CPP'
          #include <atomic>
          #include <cstdint>
          struct alignas(16) Value { std::uint64_t lo, hi; };
          static std::atomic<Value> value;
          extern "C" int atomic_sample() {
              Value desired{1,2}, expected{0,0};
              bool ok = value.compare_exchange_strong(expected, desired);
              Value got = value.load();
              return ok ? int(got.lo + got.hi) : 0;
          }
          extern "C" unsigned __int128 atomic_load16(const volatile void*, int)
              __asm__("__atomic_load_16");
          extern "C" bool atomic_cas16(volatile void*, void*, unsigned __int128, int, int)
              __asm__("__atomic_compare_exchange_16");
          extern "C" int atomic_specialized_sample() {
              alignas(16) static Value storage{0,0};
              auto first = atomic_load16(&storage, __ATOMIC_SEQ_CST);
              unsigned __int128 wanted = (static_cast<unsigned __int128>(2) << 64) | 1;
              unsigned __int128 expected = 0;
              bool ok = atomic_cas16(&storage, &expected, wanted, __ATOMIC_SEQ_CST, __ATOMIC_SEQ_CST);
              return ok ? int(first + 1) : int(expected);
          }
          int main() { return atomic_sample() + atomic_specialized_sample(); }
          CPP
          common=(--target=x86_64-pc-freebsd12-elf -std=c++20 -O0 -g0 -fPIC \
            -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE \
            -isysroot "$sdk" -isystem "$sdk/include" -isystem "$sdk/include/c++/v1")
          clang++-18 "${common[@]}" -c "$RUNNER_TEMP/probe.cpp" -o "$RUNNER_TEMP/probe.o"
          clang++-18 "${common[@]}" -c tools/etapa167/atomic_abi_ps4.cpp -o "$RUNNER_TEMP/atomic_abi.o"
          llvm-nm-18 -u "$RUNNER_TEMP/probe.o" > "$RUNNER_TEMP/undef.txt"
          llvm-nm-18 --defined-only "$RUNNER_TEMP/atomic_abi.o" > "$RUNNER_TEMP/defined.txt"
          grep -E 'U __atomic_(load|compare_exchange)$' "$RUNNER_TEMP/undef.txt"
          grep -E ' [Tt] __atomic_load$' "$RUNNER_TEMP/defined.txt"
          grep -E ' [Tt] __atomic_compare_exchange$' "$RUNNER_TEMP/defined.txt"
          grep -E ' [Tt] __atomic_load_16$' "$RUNNER_TEMP/defined.txt"
          grep -E ' [Tt] __atomic_compare_exchange_16$' "$RUNNER_TEMP/defined.txt"
          # A specific compile/link gate. It does NOT execute the ELF on the PS4.
          ld.lld-18 -m elf_x86_64 -pie --script "$sdk/link.x" --eh-frame-hdr \
            "$RUNNER_TEMP/probe.o" "$RUNNER_TEMP/atomic_abi.o" \
            -L"$sdk/lib" -lc -lkernel -lc++ "$sdk/lib/crt1.o" \
            -o "$RUNNER_TEMP/atomic-probe-ps4.elf"
          readelf -h "$RUNNER_TEMP/atomic-probe-ps4.elf" \
            | grep -E 'Class:|Machine:|Type:'
          echo 'LINGSHU167_PS4_ATOMIC16_LINK=PASSED_NO_GAME_NO_HARDWARE_TEST'
      - name: Testar preflight real do boot com imagens SINTETICAS no Linux
        shell: bash
        run: |
          set -euo pipefail
          bash tools/etapa172/test_boot_preflight_host.sh
      - name: Cruzar preflight real para PS4 com headers upstream e link sem jogo
        shell: bash
        run: |
          set -euo pipefail
          sdk="$OO_PS4_TOOLCHAIN"
          git clone -q --filter=blob:none https://github.com/SwonDev/cstlvnia-blmont-to-macos.git "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" checkout --detach 4043f21bb4f656d34cd17ba070238c7728d00631
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)" = 4043f21bb4f656d34cd17ba070238c7728d00631
          mkdir -p "$RUNNER_TEMP/compat/nx"
          cat > "$RUNNER_TEMP/compat/nx/lingshu_cpu_compat.h" <<'CPP'
          #pragma once
          #include <cstdint>
          #include <type_traits>
          namespace lingshu_cpu_compat {
          template <typename To, typename From>
          constexpr To bit_cast(const From& from) noexcept {
             static_assert(sizeof(To)==sizeof(From));
             static_assert(std::is_trivially_copyable_v<To> && std::is_trivially_copyable_v<From>);
             return __builtin_bit_cast(To,from);
          }
          template <typename T>
          constexpr T rotr(T value,int shift) noexcept {
             static_assert(std::is_unsigned_v<T>);
             constexpr int bits=int(sizeof(T)*8);
             int n=((shift%bits)+bits)%bits;
             return n ? T((value>>n)|(value<<(bits-n))) : value;
          }
          template <typename T>
          constexpr int countl_zero(T value) noexcept {
            static_assert(std::is_unsigned_v<T>);
            constexpr int bits=int(sizeof(T)*8);
            if (value==0) return bits;
            if constexpr (sizeof(T)<=4)
              return __builtin_clz(static_cast<unsigned>(value))-(32-bits);
            else
              return __builtin_clzll(static_cast<unsigned long long>(value));
          }
          template <typename T>
          constexpr int popcount(T value) noexcept {
            static_assert(std::is_unsigned_v<T>);
            if constexpr (sizeof(T)<=4)
              return __builtin_popcount(static_cast<unsigned>(value));
            else
              return __builtin_popcountll(static_cast<unsigned long long>(value));
          }
          }
          CPP
          python3 - "$RUNNER_TEMP/upstream/runtime/include/nx/cpu.h" "$RUNNER_TEMP/compat/nx/cpu.h" <<'PY_CPU'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text(encoding="utf-8")
          assert s.count("#include <bit>")==1 and s.count("std::bit_cast")>=5 and s.count("std::rotr(")==2
          s=s.replace("#include <bit>", '#include "lingshu_cpu_compat.h"')
          s=s.replace("std::bit_cast","lingshu_cpu_compat::bit_cast")
          s=s.replace("std::rotr(","lingshu_cpu_compat::rotr(")
          Path(sys.argv[2]).write_text(s,encoding="utf-8")
          PY_CPU
          cat > "$RUNNER_TEMP/boot-probe.cpp" <<'CPP'
          #include <nx/module.h>
          #include <string>
          #include <cstdio>
          #include <span>
          namespace nx {
          static const ModuleInfo a{.name="main", .data_size=1};
          static const ModuleInfo b{.name="sdk", .data_size=1};
          static const ModuleInfo c{.name="subsdk0", .data_size=1};
          std::span<const ModuleInfo* const> linked_modules() {
            static const ModuleInfo* const modules[]{&a,&b,&c};
            return modules;
          }
          }
          namespace nx::plat {
          std::string data_root(){return "/data/kazuma-lab";}
          FILE* fopen_utf8(const std::string&,const char*){return nullptr;}
          int fseek64(FILE* f,int64_t off,int whence){return std::fseek(f,off,whence);}
          int64_t ftell64(FILE* f){return std::ftell(f);}
          void log_line(const char* s){std::fprintf(stderr,"%s\n",s);}
          }
          extern "C" bool lingshu_ps4_boot_images_present();
          int main(){return lingshu_ps4_boot_images_present() ? 0 : 2;}
          CPP
          clang++-18 --target=x86_64-pc-freebsd12-elf -std=c++20 -O2 -g0 -fPIC \
            -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE \
            -isysroot "$sdk" -isystem "$sdk/include" -isystem "$sdk/include/c++/v1" \
            -I"$RUNNER_TEMP/compat" -I"$RUNNER_TEMP/upstream/runtime/include" -I"$RUNNER_TEMP/upstream/runtime/src" \
            -c tools/etapa172/ps4_boot_images_preflight.cpp -o "$RUNNER_TEMP/boot-preflight-ps4.o"
          clang++-18 --target=x86_64-pc-freebsd12-elf -std=c++20 -O2 -g0 -fPIC \
            -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE \
            -isysroot "$sdk" -isystem "$sdk/include" -isystem "$sdk/include/c++/v1" \
            -I"$RUNNER_TEMP/compat" -I"$RUNNER_TEMP/upstream/runtime/include" -I"$RUNNER_TEMP/upstream/runtime/src" \
            -c "$RUNNER_TEMP/boot-probe.cpp" -o "$RUNNER_TEMP/boot-probe-ps4.o"
          llvm-nm-18 --defined-only "$RUNNER_TEMP/boot-preflight-ps4.o" \
            | grep -E ' [Tt] lingshu_ps4_boot_images_present$'
          ld.lld-18 -m elf_x86_64 -pie --script "$sdk/link.x" --eh-frame-hdr \
            "$RUNNER_TEMP/boot-preflight-ps4.o" "$RUNNER_TEMP/boot-probe-ps4.o" \
            -L"$sdk/lib" -lc -lkernel -lc++ "$sdk/lib/crt1.o" \
            -o "$RUNNER_TEMP/boot-preflight-probe-ps4.elf"
          readelf -h "$RUNNER_TEMP/boot-preflight-probe-ps4.elf" \
            | grep -E 'Class:|Machine:|Type:'
          echo 'LINGSHU172_BOOT_PREFLIGHT_PS4_LINK=PASSED_NO_GAME_NO_HARDWARE_TEST'
      - name: Vincular o adaptador de memoria para PS4 (OpenOrbis, sem jogo)
        shell: bash
        run: |
          set -euo pipefail
          sdk="$OO_PS4_TOOLCHAIN"
          cat > "$RUNNER_TEMP/memory-probe.cpp" <<'CPP'
          #include "platform.h"
          int main() {
            // Probe the real symbols, without reserving memory on hardware.
            return (nx::plat::reserve(0,0) || nx::plat::commit(0,0)) ? 1 : 0;
          }
          CPP
          clang++-18 --target=x86_64-pc-freebsd12-elf -std=c++20 -O0 -g0 -fPIC \
            -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE \
            -isysroot "$sdk" -isystem "$sdk/include" -isystem "$sdk/include/c++/v1" \
            -I"$RUNNER_TEMP/upstream/runtime/src" \
            -c tools/etapa146/platform_ps4_virtual_memory.cpp \
            -o "$RUNNER_TEMP/ps4-virtual-memory.o"
          clang++-18 --target=x86_64-pc-freebsd12-elf -std=c++20 -O0 -g0 -fPIC \
            -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE \
            -isysroot "$sdk" -isystem "$sdk/include" -isystem "$sdk/include/c++/v1" \
            -I"$RUNNER_TEMP/upstream/runtime/src" \
            -c "$RUNNER_TEMP/memory-probe.cpp" -o "$RUNNER_TEMP/memory-probe.o"
          ld.lld-18 -m elf_x86_64 -pie --script "$sdk/link.x" --eh-frame-hdr \
            "$RUNNER_TEMP/ps4-virtual-memory.o" "$RUNNER_TEMP/memory-probe.o" \
            -L"$sdk/lib" -lc -lkernel -lc++ "$sdk/lib/crt1.o" \
            -o "$RUNNER_TEMP/ps4-memory-link-probe.elf"
          readelf -h "$RUNNER_TEMP/ps4-memory-link-probe.elf" \
            | grep -E 'Class:|Machine:|Type:'
          echo 'LINGSHU175_PS4_MEMORY_LINK=PASSED_NO_GAME_NO_HARDWARE_TEST'
