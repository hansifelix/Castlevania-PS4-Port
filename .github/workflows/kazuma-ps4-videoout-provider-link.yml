name: 'Kazuma PS4 - VideoOut real ligado ao game (SEM JOGO)'
on:
  pull_request:
    paths:
      - 'src/ps4/castlevania_game_ps4.cpp'
      - 'tools/etapa74/platform_ps4_display.cpp'
      - '.github/workflows/kazuma-ps4-videoout-provider-link.yml'
  push:
    branches: [main]
    paths:
      - 'src/ps4/castlevania_game_ps4.cpp'
      - 'tools/etapa74/platform_ps4_display.cpp'
      - '.github/workflows/kazuma-ps4-videoout-provider-link.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  link-videoout-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 lld-18 binutils git curl ca-certificates
      - name: Obter SDK OpenOrbis e interfaces MIT fixadas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk"
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz' \
            -o "$RUNNER_TEMP/openorbis.tar.gz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/openorbis.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/openorbis.tar.gz" -C "$RUNNER_TEMP/sdk"
          sdk_link="$(find "$RUNNER_TEMP/sdk" -name link.x -type f -print -quit)"
          test -n "$sdk_link"
          echo "OO_PS4_TOOLCHAIN=$(dirname "$sdk_link")" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --sparse \
            https://github.com/SwonDev/cstlvnia-blmont-to-macos.git "$RUNNER_TEMP/nx-src"
          git -C "$RUNNER_TEMP/nx-src" checkout -q --detach \
            4043f21bb4f656d34cd17ba070238c7728d00631
          git -C "$RUNNER_TEMP/nx-src" sparse-checkout set runtime/src runtime/include/nx
          test -s "$RUNNER_TEMP/nx-src/runtime/src/platform.h"
          echo "KAZUMA_NX_SOURCE=$RUNNER_TEMP/nx-src" >> "$GITHUB_ENV"
      - name: Compilar provedores reais e ligar juntos com LLD
        shell: bash
        run: |
          set -euo pipefail
          sdk="$OO_PS4_TOOLCHAIN"
          src="$KAZUMA_NX_SOURCE"
          mkdir -p build/videoout-provider
          common=(--target=x86_64-pc-freebsd12-elf -std=c++20 -O1 -fPIC
            -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE
            -isysroot "$sdk" -isystem "$sdk/include" -isystem "$sdk/include/c++/v1"
            -I"$src/runtime/include" -I"$src/runtime/src" -Isrc/ps4)
          clang++-18 "${common[@]}" -c src/ps4/castlevania_game_ps4.cpp \
            -o build/videoout-provider/game.o
          clang++-18 "${common[@]}" -c tools/etapa74/platform_ps4_display.cpp \
            -o build/videoout-provider/videoout.o
          ld.lld-18 -m elf_x86_64 -r \
            -o build/videoout-provider/combined.o \
            build/videoout-provider/game.o build/videoout-provider/videoout.o
          readelf -h build/videoout-provider/combined.o | grep -q 'REL (Relocatable file)'
          llvm-nm-18 -C --defined-only build/videoout-provider/combined.o \
            > build/videoout-provider/defined.txt
          llvm-nm-18 -C --undefined-only build/videoout-provider/combined.o \
            > build/videoout-provider/undefined.txt
          grep -Fq 'nx::game::after_init()' build/videoout-provider/defined.txt
          grep -Fq 'nx::plat::screen_size(unsigned int&, unsigned int&)' build/videoout-provider/defined.txt
          if grep -Fq 'nx::plat::screen_size(unsigned int&, unsigned int&)' build/videoout-provider/undefined.txt; then
            echo 'FALHA: screen_size ainda indefinido' >&2; exit 3
          fi
          # Must still depend on the actual SDK's VideoOut API, never a fake provider.
          grep -Fq 'sceVideoOutGetResolutionStatus' build/videoout-provider/undefined.txt
          grep -Fq 'sceVideoOutOpen' build/videoout-provider/undefined.txt
          grep -Fq 'sceVideoOutClose' build/videoout-provider/undefined.txt
          sha256sum build/videoout-provider/combined.o > build/videoout-provider/SHA256.txt
          echo 'PASS: VideoOut provider + game hooks real ELF relocatable; no game/eboot/PKG'
      - name: Publicar apenas prova textual
        uses: actions/upload-artifact@v4
        with:
          name: kazuma-ps4-videoout-link-textos
          path: |
            build/videoout-provider/defined.txt
            build/videoout-provider/undefined.txt
            build/videoout-provider/SHA256.txt
          retention-days: 7
          if-no-files-found: error
