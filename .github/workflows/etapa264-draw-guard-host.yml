name: Etapas 264-266 — draw guard, slots graphics e integração fail-closed

on:
  push:
    branches:
      - kazuma-etapa258-unsupported-stage-failclosed-20261121
    paths:
      - "tests/test_unsupported_shader_stage_draw_guard.py"
      - "tests/test_unsupported_graphics_stage_binding.py"
      - "tests/test_unsupported_shader_stage_integration.py"
      - "tools/link/patch_unsupported_shader_stage_failclosed.py"
      - ".github/workflows/etapa264-draw-guard-host.yml"
  pull_request:
    paths:
      - "tests/test_unsupported_shader_stage_draw_guard.py"
      - "tests/test_unsupported_graphics_stage_binding.py"
      - "tests/test_unsupported_shader_stage_integration.py"
      - "tools/link/patch_unsupported_shader_stage_failclosed.py"
      - ".github/workflows/etapa264-draw-guard-host.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draw-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compilar os guards de draw e os slots graphics extraídos dos patches de produção
        run: |
          set -euo pipefail
          python3 tests/test_unsupported_shader_stage_draw_guard.py
          python3 tests/test_unsupported_graphics_stage_binding.py
          python3 tests/test_unsupported_shader_stage_integration.py
