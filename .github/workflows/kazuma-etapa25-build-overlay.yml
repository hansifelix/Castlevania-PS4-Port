name: 'Kazuma Etapa 25: build real orbis-compat com OpenOrbis (SEM PKG)'
on:
  pull_request:
    paths:
      - '.github/workflows/kazuma-etapa25-build-overlay.yml'
      - 'tools/etapa25/**'
      - 'docs/KAZUMA_ETAPA25_PRIMEIRO_BUILD_OVERLAY.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compilar-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Kazuma
        uses: actions/checkout@v4
      - name: Testes locais e sintaxe
        run: |
          set -euo pipefail
          python3 -m py_compile tools/etapa25/validar_arquivo.py
          python3 -m unittest discover -s tools/etapa25/tests -v
      - name: Instalar ferramentas cross (somente no runner)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 llvm-18 llvm-18-tools lld-18 xz-utils
          for tool in clang clang++ llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf; do
            command -v "$tool" || exit 1
          done
      - name: SDK OpenOrbis v0.5.4 verificado por SHA256
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openorbis" "$RUNNER_TEMP/download"
          curl -fL --retry 3 --retry-delay 3 \
            'https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz' \
            -o "$RUNNER_TEMP/download/openorbis.tar.gz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/download/openorbis.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/download/openorbis.tar.gz" -C "$RUNNER_TEMP/openorbis"
          sdk_link="$(find "$RUNNER_TEMP/openorbis" -type f -name link.x -print -quit)"
          [[ -n "$sdk_link" ]]
          echo "OO_PS4_TOOLCHAIN=$(dirname "$sdk_link")" >> "$GITHUB_ENV"
      - name: Obter orbis-compat de commit fixo
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none https://github.com/orbis-ports/orbis-compat.git "$RUNNER_TEMP/orbis-compat"
          git -C "$RUNNER_TEMP/orbis-compat" checkout -q --detach 6922a7b6f4291a28edd239f1a4db50ed7aa00359
          [[ -s "$RUNNER_TEMP/orbis-compat/build.sh" ]]
      - name: Compilar liborbis-compat.a de verdade no runner
        run: |
          set -euo pipefail
          mkdir -p relatorios/etapa25
          bash "$RUNNER_TEMP/orbis-compat/build.sh" 2>&1 | tee relatorios/etapa25/BUILD.log
          file "$RUNNER_TEMP/orbis-compat/build/liborbis-compat.a" | tee relatorios/etapa25/ARQUIVO.log
          llvm-readelf -h "$RUNNER_TEMP/orbis-compat/build/$(llvm-ar t "$RUNNER_TEMP/orbis-compat/build/liborbis-compat.a" | head -n 1)" >/dev/null 2>&1 || true
          python3 tools/etapa25/validar_arquivo.py \
            --archive "$RUNNER_TEMP/orbis-compat/build/liborbis-compat.a" \
            --out relatorios/etapa25
          echo 'GATE 25: biblioteca compilada, sem driver Vulkan e sem PKG.'
      - name: Publicar relatorios mesmo se falhar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kazuma-etapa25-build-real-do-overlay-sem-pkg
          path: relatorios/etapa25/
          if-no-files-found: warn
          retention-days: 30
