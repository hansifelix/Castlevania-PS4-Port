name: 'Kazuma Etapa 49 - ligar 6 APIs host ao boot runtime PS4 (SEM JOGO / SEM PKG)'
on:
  pull_request:
    paths:
      - '.github/workflows/kazuma-etapa49-host-basics.yml'
      - 'tools/etapa49/**'
      - 'docs/KAZUMA_ETAPA49.md'
      - 'tools/etapa48/**'
      - 'docs/KAZUMA_ETAPA48.md'
      - 'tools/etapa42/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integracao-runtime-plataforma:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Kazuma
        uses: actions/checkout@v4
      - name: Instalar compiladores e ferramentas
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 lld-18 binutils git curl ca-certificates python3
      - name: Obter SDK e runtime publico de commits fixados
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk" "$RUNNER_TEMP/download" relatorios/etapa39
          curl -fLsS --retry 3 --retry-delay 3 \
            'https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz' \
            -o "$RUNNER_TEMP/download/openorbis.tar.gz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/download/openorbis.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/download/openorbis.tar.gz" -C "$RUNNER_TEMP/sdk"
          sdk_link="$(find "$RUNNER_TEMP/sdk" -type f -name link.x -print -quit)"
          test -n "$sdk_link"
          echo "OO_PS4_TOOLCHAIN=$(dirname "$sdk_link")" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --sparse https://github.com/SwonDev/cstlvnia-blmont-to-macos.git "$RUNNER_TEMP/nx-src"
          git -C "$RUNNER_TEMP/nx-src" checkout -q --detach 4043f21bb4f656d34cd17ba070238c7728d00631
          git -C "$RUNNER_TEMP/nx-src" sparse-checkout set runtime/src runtime/include/nx
          test -s "$RUNNER_TEMP/nx-src/runtime/src/nvn/nvn_vk.cpp"
          git -C "$RUNNER_TEMP/nx-src" show HEAD:LICENSE > relatorios/etapa39/LICENCA_MIT_UPSTREAM.txt
          echo 'KAZUMA_NX_SOURCE='"$RUNNER_TEMP/nx-src" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --sparse https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vkh"
          git -C "$RUNNER_TEMP/vkh" checkout -q --detach acbb9391c0a597272800cd3f4363661c00a27c77
          git -C "$RUNNER_TEMP/vkh" sparse-checkout set include/vulkan include/vk_video
          test -s "$RUNNER_TEMP/vkh/include/vk_video/vulkan_video_codec_h264std.h"
          echo 'KAZUMA_VK_HEADERS='"$RUNNER_TEMP/vkh/include" >> "$GITHUB_ENV"
          printf '%s\n' \
            'SwonDev/cstlvnia-blmont-to-macos @ 4043f21bb4f656d34cd17ba070238c7728d00631 (MIT)' \
            'Vulkan-Headers @ acbb9391c0a597272800cd3f4363661c00a27c77' \
            'OpenOrbis v0.5.4, SHA256 validado' \
            'Sem APK, codigo comercial, recursos do jogo, PKG ou execucao real no PS4.' \
            > relatorios/etapa39/FONTES.txt
      - name: Compatibilidade C++20 temporaria identica as Etapas 35 e 36
        run: |
          set -euo pipefail
          src="$KAZUMA_NX_SOURCE/runtime/include/nx/cpu.h"
          mkdir -p "$RUNNER_TEMP/compat/nx"
          cat > "$RUNNER_TEMP/compat/nx/kazuma_cpu_compat.h" <<'CPP'
          #pragma once
          #include <cstdint>
          #include <type_traits>
          namespace kazuma_cpu_compat {
          template <typename To, typename From>
          constexpr To bit_cast(const From& from) noexcept {
              static_assert(sizeof(To) == sizeof(From));
              static_assert(std::is_trivially_copyable_v<To> && std::is_trivially_copyable_v<From>);
              return __builtin_bit_cast(To, from);
          }
          template <typename T>
          constexpr T rotr(T value, int shift) noexcept {
              static_assert(std::is_unsigned_v<T>);
              constexpr int bits = int(sizeof(T) * 8);
              int n = ((shift % bits) + bits) % bits;
              return n ? T((value >> n) | (value << (bits - n))) : value;
          }
          }
          CPP
          python3 - "$src" "$RUNNER_TEMP/compat/nx/cpu.h" <<'PY_COMPAT'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text(encoding='utf-8')
          assert s.count('#include <bit>')==1 and s.count('std::bit_cast')>=5 and s.count('std::rotr(')==2
          patched=(s.replace('#include <bit>', '#include "kazuma_cpu_compat.h"')
                    .replace('std::bit_cast', 'kazuma_cpu_compat::bit_cast')
                    .replace('std::rotr(', 'kazuma_cpu_compat::rotr('))
          Path(sys.argv[2]).write_text(patched, encoding='utf-8')
          PY_COMPAT
      - name: Corrigir 2 incompatibilidades C++ somente no runner (nao altera upstream)
        run: |
          set -euo pipefail
          python3 - <<'PY_FIX_NVNS'
          from pathlib import Path
          import os
          root = Path(os.environ['KAZUMA_NX_SOURCE']) / 'runtime/src/nvn'
          a = root / 'nvn_binds.cpp'
          source = a.read_text(encoding='utf-8')
          # Ordem de includes equivalente a nvn_debug.cpp (que ja compila no OpenOrbis).
          marker = '#include <atomic>'
          assert source.count(marker) == 1 and '#include <cmath>' in source
          assert source.index(marker) < source.index('#include <cmath>')
          a.write_text(source.replace(marker, '#include <algorithm>' + chr(10) + marker, 1), encoding='utf-8')
          b = root / 'nvn_debug.cpp'
          source = b.read_text(encoding='utf-8')
          # OpenOrbis deduz double em std::ldexp; std::max quer tipos identicos.
          before = 'else big = std::max(big, std::ldexp(float(1024 + m), int(e) - 25) * (e ? 1.0f : 0.0f));'
          after  = 'else big = std::max(big, static_cast<float>(std::ldexp(float(1024 + m), int(e) - 25) * (e ? 1.0f : 0.0f)));'
          assert source.count(before) == 1, 'Upstream mudou, abortar em vez de aplicar patch errado.'
          b.write_text(source.replace(before, after, 1), encoding='utf-8')
          (Path('relatorios/etapa39') / 'CORRECOES_TEMPORARIAS.txt').write_text(
              'nvn_binds.cpp: algorithm antes de cmath para incluir abs (libc++ OpenOrbis).'+chr(10)+
              'nvn_debug.cpp: static_cast<float> antes de std::max.'+chr(10)+
              'Modificacoes realizadas apenas no checkout temporario do GitHub runner.'+chr(10),
              encoding='utf-8')
          print('Dois bloqueios de compilacao tratados, sem modificar repositorio upstream.')
          PY_FIX_NVNS
      - name: Inventariar e compilar unidades portaveis de TODO runtime
        run: |
          set -euo pipefail
          src="$KAZUMA_NX_SOURCE"
          sdk="$OO_PS4_TOOLCHAIN"
          out="$RUNNER_TEMP/kazuma39"
          mkdir -p "$out/objects" relatorios/etapa39/erros
          flags=(--target=x86_64-pc-freebsd12-elf -std=c++20 -O0 -fPIC
            -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE
            -isysroot "$sdk" -isystem "$sdk/include" -isystem "$sdk/include/c++/v1"
            -I"$RUNNER_TEMP/compat" -I"$src/runtime/include" -I"$src/runtime/src"
            -I"$src/runtime/src/nvn" -I"$KAZUMA_VK_HEADERS")
          total=0; attempted=0; compiled=0; failed=0; skipped=0
          nvn_total=0; nvn_compiled=0; nvn_failed=0
          printf 'status\tmodulo\tmotivo\n' > relatorios/etapa39/INVENTARIO.tsv
          : > relatorios/etapa39/RESUMO_ERROS.txt
          : > "$out/objects.lst"
          # Excluimos APENAS implementacoes explicitamente especificas de outros SO,
          # e o launcher main (depende da plataforma). O restante sera testado, inclusive os que falharem.
          while IFS= read -r file; do
            rel="${file#"$src/"}"
            total=$((total+1))
            if [[ "$rel" == runtime/src/nvn/* ]]; then nvn_total=$((nvn_total+1)); fi
            case "$rel" in
              runtime/src/platform_*.cpp|runtime/src/memguard_*.cpp|runtime/src/mac_memory.cpp|runtime/src/main.cpp)
                skipped=$((skipped+1))
                printf 'IGNORADO\t%s\timplementacao especifica de SO ou launcher (precisa PS4)\n' "$rel" >> relatorios/etapa39/INVENTARIO.tsv
                continue;;
            esac
            attempted=$((attempted+1))
            obj="$out/objects/${rel//\//_}.o"
            log="$out/compilacao.log"
            echo "[ETAPA37] $attempted: $rel"
            if clang++-18 "${flags[@]}" -c "$file" -o "$obj" > "$log" 2>&1; then
              compiled=$((compiled+1))
              if [[ "$rel" == runtime/src/nvn/* ]]; then nvn_compiled=$((nvn_compiled+1)); fi
              printf '%s\n' "$obj" >> "$out/objects.lst"
              printf 'OK\t%s\tobjeto x86-64 gerado\n' "$rel" >> relatorios/etapa39/INVENTARIO.tsv
            else
              failed=$((failed+1))
              if [[ "$rel" == runtime/src/nvn/* ]]; then nvn_failed=$((nvn_failed+1)); fi
              printf 'FALHOU\t%s\tconsultar RESUMO_ERROS.txt\n' "$rel" >> relatorios/etapa39/INVENTARIO.tsv
              printf '\n========== %s ==========\n' "$rel" >> relatorios/etapa39/RESUMO_ERROS.txt
              grep -E -m 7 '(^| )fatal error:|(^| )error:|file not found|undefined reference' "$log" >> relatorios/etapa39/RESUMO_ERROS.txt || tail -n 10 "$log" >> relatorios/etapa39/RESUMO_ERROS.txt
              # Arquivo de log apenas dos erros; o conjunto total pode ser grande.
              base="${rel//\//_}"
              cp "$log" "relatorios/etapa39/erros/${base}.log"
            fi
          done < <(find "$src/runtime/src" -type f -name '*.cpp' | LC_ALL=C sort)
          printf 'ARQUIVOS_CPP_TOTAIS=%d\nARQUIVOS_TESTADOS=%d\nCOMPILARAM=%d\nFALHARAM=%d\nIGNORADOS_SO_HOST=%d\nNVN_TOTAIS=%d\nNVN_COMPILARAM=%d\nNVN_FALHARAM=%d\n' \
            "$total" "$attempted" "$compiled" "$failed" "$skipped" "$nvn_total" "$nvn_compiled" "$nvn_failed" \
            | tee relatorios/etapa39/CONTAGEM.txt
          if (( attempted != compiled + failed || total != attempted + skipped )); then
            echo 'ERRO: contagens inconsistentes' >&2; exit 1;
          fi
          test "$compiled" -ge 3 || { echo 'ERRO: menos de tres modulos compilados' >&2; exit 1; }
          # Arquivo de bibliotecas compiladas e link parcial, sem representar programa executavel.
          mapfile -t objs < "$out/objects.lst"
          llvm-ar-18 rcs "$out/libkazuma-runtime-partial.a" "${objs[@]}"
          if ld.lld-18 -m elf_x86_64 -r -o "$out/runtime_partial.o" "${objs[@]}" \
              > relatorios/etapa39/LINK_PARCIAL.log 2>&1; then
            printf 'LINK_PARCIAL_RELOCAVEL=SIM\n' | tee relatorios/etapa39/LINK_STATUS.txt
            llvm-nm-18 -C -u "$out/runtime_partial.o" | LC_ALL=C sort -u > relatorios/etapa39/SIMBOLOS_EXTERNOS.txt || true
          else
            printf 'LINK_PARCIAL_RELOCAVEL=NAO\n' | tee relatorios/etapa39/LINK_STATUS.txt
            printf 'O LINK PARCIAL FALHOU; nao ha executavel. Consulte LINK_PARCIAL.log\n' >> relatorios/etapa39/RESUMO_ERROS.txt
          fi
          sha256sum "$out/libkazuma-runtime-partial.a" > relatorios/etapa39/ARQUIVO_SHA256.txt
          echo 'Auditoria finalizada: objetos de compilacao, NAO runtime executavel, SEM PKG e SEM teste PS4.'
          # Falha aqui vira check vermelho, mas os relatorios sao publicados no proximo step.
          if (( failed > 0 )); then
            echo "CHECK VERMELHO ESPERADO: $failed componentes precisam de adaptacao. Veja relatorios/etapa39/"
            exit 1
          fi
          [[ -s relatorios/etapa39/LINK_STATUS.txt ]] && grep -q 'LINK_PARCIAL_RELOCAVEL=SIM' relatorios/etapa39/LINK_STATUS.txt
      - name: Integrar 3 funcoes PS4 reais e comparar referencias externas
        run: |
          set -euo pipefail
          src="$KAZUMA_NX_SOURCE"
          sdk="$OO_PS4_TOOLCHAIN"
          out="$RUNNER_TEMP/kazuma39"
          report="relatorios/etapa39"
          test -s "$out/runtime_partial.o"
          test -s tools/etapa47/platform_ps4_core_clock.cpp
          # Recuperar status EXATAMENTE dos 87 arquivos antes da integracao.
          grep -Fxq 'COMPILARAM=87' "$report/CONTAGEM.txt"
          grep -Fxq 'FALHARAM=0' "$report/CONTAGEM.txt"
          grep -Fxq 'LINK_PARCIAL_RELOCAVEL=SIM' "$report/LINK_STATUS.txt"
          clang++-18 --target=x86_64-pc-freebsd12-elf -std=c++20 -O1 -fPIC \
            -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE \
            -isysroot "$sdk" -isystem "$sdk/include" -isystem "$sdk/include/c++/v1" \
            -I"$src/runtime/src" \
            -c tools/etapa47/platform_ps4_core_clock.cpp \
            -o "$out/platform_ps4_core.o" \
            2>&1 | tee "$report/COMPILAR_PLATAFORMA.txt"
          # Link -r permite simbolos ainda indefinidos; NAO e um ELF executavel.
          ld.lld-18 -m elf_x86_64 -r -o "$out/runtime_com_plataforma_partial.o" \
            "$out/runtime_partial.o" "$out/platform_ps4_core.o" \
            2>&1 | tee "$report/LINK_INTEGRACAO.txt"
          readelf -h "$out/runtime_com_plataforma_partial.o" > "$report/ELF_INTEGRADO.txt"
          grep -Eq 'Machine:.*Advanced Micro Devices X86-64' "$report/ELF_INTEGRADO.txt"
          llvm-nm-18 -C -u "$out/runtime_partial.o" | LC_ALL=C sort -u > "$report/INDEFINIDOS_ANTES.txt"
          llvm-nm-18 -C -u "$out/runtime_com_plataforma_partial.o" | LC_ALL=C sort -u > "$report/INDEFINIDOS_DEPOIS.txt"
          llvm-nm-18 -C --defined-only "$out/runtime_com_plataforma_partial.o" > "$report/SIMBOLOS_DEFINIDOS.txt"
          python3 - "$report" <<'PY_SYMBOLS'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); before=(p/'INDEFINIDOS_ANTES.txt').read_text().splitlines()
          after=(p/'INDEFINIDOS_DEPOIS.txt').read_text().splitlines()
          defined=(p/'SIMBOLOS_DEFINIDOS.txt').read_text().splitlines()
          targets=['nx::plat::log_line(char const*)', 'nx::plat::monotonic_ns()', 'nx::plat::sleep_ns(long)']
          for sym in targets:
              assert any(sym in row for row in before), f'Antes nao tinha simbolo esperado: {sym}'
              assert not any(sym in row for row in after), f'Pendente apos link: {sym}'
              assert any(sym in row for row in defined), f'Simbolo nao definido: {sym}'
          before_plat={row.split('nx::plat::',1)[1].strip() for row in before if 'nx::plat::' in row}
          after_plat={row.split('nx::plat::',1)[1].strip() for row in after if 'nx::plat::' in row}
          removed=sorted(before_plat-after_plat)
          added=sorted(after_plat-before_plat)
          summary=(
             'STATUS=LINK_RELOCAVEL_PARCIAL_SUCESSO\n'
             'OBJETOS_RUNTIME=87\n'
             'OBJETOS_PLATAFORMA=1\n'
             'FUNCOES_PLATAFORMA_RESOLVIDAS=3\n'
             f'PLAT_REFERENCIAS_ANTES={len(before_plat)}\n'
             f'PLAT_REFERENCIAS_DEPOIS={len(after_plat)}\n'
             f'INDEFINIDOS_TOTAIS_ANTES={len(before)}\n'
             f'INDEFINIDOS_TOTAIS_DEPOIS={len(after)}\n'
             'AVISO=LINK -r NAO gera executavel, nao valida runtime completo ou funcionamento no PS4.\n'
          ).replace('\n','\n')
          (p/'RESULTADO_LIGACAO.txt').write_text(summary+'\nSIMBOLOS_PLATAFORMA_RESOLVIDOS:\n'+'\n'.join(removed)+'\nNOVOS_SIMBOLOS_PLATAFORMA:\n'+'\n'.join(added)+'\n')
          print(summary)
          PY_SYMBOLS
          sha256sum "$out/runtime_com_plataforma_partial.o" > "$report/SHA256_OBJETO_INTEGRADO.txt"
          echo 'Etapa39: 87 objetos integrados a 3 funcoes reais; nao e executavel, nao e o jogo, nenhum PKG.'

      - name: Integrar cinco APIs ao runtime e classificar pendencias
        run: |
          set -euo pipefail
          bash tools/etapa41/integrar_runtime.sh

      - name: Testar analisador do linker
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/etapa42 -p 'test_*.py' -v
      - name: Tentar link executavel ESTRITO e explicar bloqueios
        run: |
          set -euo pipefail
          bash tools/etapa42/tentar_link_real.sh

      - name: Testar analisador da Etapa 48
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/etapa48 -p 'test_*.py' -v
      - name: Compilar nx boot real e diagnosticar simbolos restantes
        run: |
          set -euo pipefail
          bash tools/etapa48/tentar_boot_real.sh
          test -s relatorios/etapa48/LEIA_PRIMEIRO.txt
          test -s relatorios/etapa48/RESUMO.json

      - name: Testar auditoria e funcoes portaveis no Linux (NAO PS4)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/etapa49 -p 'test_*.py' -v
          clang++-18 -std=c++20 -O0 -Wall -Wextra -Werror             tools/etapa49/platform_ps4_host_basics.cpp             tools/etapa49/test_host.cpp -o "$RUNNER_TEMP/kazuma49_host_test"
          "$RUNNER_TEMP/kazuma49_host_test"
      - name: Ligar APIs PS4 de host sem falsificar grafico, audio e memoria
        run: |
          set -euo pipefail
          bash tools/etapa49/integrar_host_basics.sh

      - name: Publicar diagnosticos SEM artefatos comerciais ou PKG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kazuma-etapa49-delta-dependencias-boot-real-sem-pkg
          path: relatorios/
          if-no-files-found: warn
          retention-days: 20
