name: 'Kazuma - Etapa 20: ABI CPU nx para PS4 (SEM PKG)'
on:
  pull_request:
    paths:
      - '.github/workflows/kazuma-etapa20-cpu-gate.yml'
      - 'tools/etapa20/**'
      - 'docs/KAZUMA_ETAPA20_CPU_GATE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Kazuma
        uses: actions/checkout@v4
      - name: Testes locais de contrato
        run: |
          set -euo pipefail
          bash -n tools/etapa20/testar_cpu_guest_openorbis.sh
          python3 -m unittest discover -s tools/etapa20/tests -v
      - name: Instalar compiladores
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld binutils curl ca-certificates git python3
      - name: Obter OpenOrbis v0.5.4 (hash verificado)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk-bundle" "$RUNNER_TEMP/sdk"
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz' \
            -o "$RUNNER_TEMP/sdk-bundle/openorbis.tar.gz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/sdk-bundle/openorbis.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/sdk-bundle/openorbis.tar.gz" -C "$RUNNER_TEMP/sdk"
          sdk_link="$(find "$RUNNER_TEMP/sdk" -type f -name link.x -print -quit)"
          test -n "$sdk_link"
          sdk="$(dirname "$sdk_link")"
          test -s "$sdk/lib/crt1.o"
          echo "OO_PS4_TOOLCHAIN=$sdk" >> "$GITHUB_ENV"
      - name: Obter contratos CPU publicos da revisao fixada
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --sparse https://github.com/SwonDev/cstlvnia-blmont-to-macos.git "$RUNNER_TEMP/nx-source"
          git -C "$RUNNER_TEMP/nx-source" checkout -q --detach 4043f21bb4f656d34cd17ba070238c7728d00631
          git -C "$RUNNER_TEMP/nx-source" sparse-checkout set runtime/include/nx
          test -s "$RUNNER_TEMP/nx-source/runtime/include/nx/cpu.h"
          echo "KAZUMA_NX_SOURCE=$RUNNER_TEMP/nx-source" >> "$GITHUB_ENV"
      - name: Compilar ABI nx CPU e ligar ELF x86-64 alvo PS4
        run: |
          set -euo pipefail
          bash tools/etapa20/testar_cpu_guest_openorbis.sh "$OO_PS4_TOOLCHAIN" "$KAZUMA_NX_SOURCE" \
            2>&1 | tee etapa20_execucao.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('relatorios/etapa20/resultado.json').read_text())
          assert x['compilou_abi_cpu'] and x['linkou_elf_ps4']
          assert x['codigo_arm64_recompilado_do_jogo'] is False
          assert x['gerou_pkg'] is False and x['executado_no_ps4'] is False
          assert x['viabilidade_menu_original'] == 'NAO_DETERMINADA'
          PY
      - name: Publicar diagnosticos (inclusive quando falhar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kazuma-etapa20-abi-cpu-sem-pkg
          path: |
            etapa20_execucao.txt
            relatorios/etapa20/
          if-no-files-found: warn
          retention-days: 30
