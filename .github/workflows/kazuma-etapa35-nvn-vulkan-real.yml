name: 'Kazuma Etapa 35 - NVN Vulkan REAL alvo PS4 (SEM PKG)'
on:
  pull_request:
    paths:
      - '.github/workflows/kazuma-etapa35-nvn-vulkan-real.yml'
      - 'tools/etapa35/**'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  compilar-nvn-vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Kazuma
        uses: actions/checkout@v4
      - name: Instalar compilador
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 lld-18 binutils git curl ca-certificates python3
      - name: Preparar fontes publicas fixadas e SDK OpenOrbis
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk" "$RUNNER_TEMP/download" relatorios/etapa35
          curl -fLsS --retry 3 --retry-delay 3 \
            'https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz' \
            -o "$RUNNER_TEMP/download/openorbis.tar.gz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/download/openorbis.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/download/openorbis.tar.gz" -C "$RUNNER_TEMP/sdk"
          sdk_link="$(find "$RUNNER_TEMP/sdk" -type f -name link.x -print -quit)"
          test -n "$sdk_link"
          echo "OO_PS4_TOOLCHAIN=$(dirname "$sdk_link")" >> "$GITHUB_ENV"

          git clone -q --filter=blob:none --sparse https://github.com/SwonDev/cstlvnia-blmont-to-macos.git "$RUNNER_TEMP/nx-src"
          git -C "$RUNNER_TEMP/nx-src" checkout -q --detach 4043f21bb4f656d34cd17ba070238c7728d00631
          git -C "$RUNNER_TEMP/nx-src" sparse-checkout set runtime/src runtime/include/nx
          test -s "$RUNNER_TEMP/nx-src/runtime/src/nvn/nvn_gpu_pick.cpp"
          test -s "$RUNNER_TEMP/nx-src/runtime/src/nvn/nvn_vk.h"
          test -s "$RUNNER_TEMP/nx-src/runtime/src/vk_gen.h"
          git -C "$RUNNER_TEMP/nx-src" show HEAD:LICENSE > relatorios/etapa35/LICENCA_MIT.txt
          echo "KAZUMA_NX_SOURCE=$RUNNER_TEMP/nx-src" >> "$GITHUB_ENV"

          git clone -q --filter=blob:none --sparse https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vkh"
          git -C "$RUNNER_TEMP/vkh" checkout -q --detach acbb9391c0a597272800cd3f4363661c00a27c77
          git -C "$RUNNER_TEMP/vkh" sparse-checkout set include/vulkan
          test -s "$RUNNER_TEMP/vkh/include/vulkan/vulkan.h"
          echo "KAZUMA_VK_HEADERS=$RUNNER_TEMP/vkh/include" >> "$GITHUB_ENV"
          printf '%s\n' \
            'SwonDev runtime 4043f21bb4f656d34cd17ba070238c7728d00631 (MIT)' \
            'Khronos Vulkan-Headers acbb9391c0a597272800cd3f4363661c00a27c77' \
            'OpenOrbis SDK v0.5.4 SHA256 verificado' \
            'Sem ROMs, ExeFS, RomFS, APK, shaders comerciais ou PKG.' \
            > relatorios/etapa35/FONTES.txt
      - name: Preparar compatibilidade C++20 SOMENTE em copia temporaria
        run: |
          set -euo pipefail
          src="$KAZUMA_NX_SOURCE/runtime/include/nx/cpu.h"
          mkdir -p "$RUNNER_TEMP/compat/nx"
          cat > "$RUNNER_TEMP/compat/nx/kazuma_cpu_compat.h" <<'CPP'
          #pragma once
          #include <cstdint>
          #include <type_traits>
          namespace kazuma_cpu_compat {
          template <typename To, typename From>
          constexpr To bit_cast(const From& from) noexcept {
              static_assert(sizeof(To) == sizeof(From));
              static_assert(std::is_trivially_copyable_v<To> && std::is_trivially_copyable_v<From>);
              return __builtin_bit_cast(To, from);
          }
          template <typename T>
          constexpr T rotr(T value, int shift) noexcept {
              static_assert(std::is_unsigned_v<T>);
              constexpr int bits = int(sizeof(T) * 8);
              int n = ((shift % bits) + bits) % bits;
              return n ? T((value >> n) | (value << (bits - n))) : value;
          }
          }
          CPP
          python3 - "$src" "$RUNNER_TEMP/compat/nx/cpu.h" <<'PY'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text(encoding='utf-8')
          assert s.count('#include <bit>')==1 and s.count('std::bit_cast')>=5 and s.count('std::rotr(')==2
          s=(s.replace('#include <bit>', '#include "kazuma_cpu_compat.h"')
               .replace('std::bit_cast', 'kazuma_cpu_compat::bit_cast')
               .replace('std::rotr(', 'kazuma_cpu_compat::rotr('))
          Path(sys.argv[2]).write_text(s, encoding='utf-8')
          PY
          echo 'Compatibilidade C++20 aplicada apenas na copia temporaria; upstream intocado.'
      - name: Compilar CAMINHO VULKAN do codigo NVN original para PS4
        run: |
          set -euo pipefail
          src="$KAZUMA_NX_SOURCE"
          sdk="$OO_PS4_TOOLCHAIN"
          mkdir -p "$RUNNER_TEMP/kazuma35"
          # DIFERENCA DA ETAPA34: SEM -DNX_GPU_PICK_STANDALONE.
          # Inclui nvn_vk.h / vk_gen.h e referencia a API Vulkan real.
          clang++-18 --target=x86_64-pc-freebsd12-elf -std=c++20 -O1 -fPIC \
            -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE \
            -isysroot "$sdk" -isystem "$sdk/include" -isystem "$sdk/include/c++/v1" \
            -I"$RUNNER_TEMP/compat" -I"$src/runtime/include" -I"$src/runtime/src" \
            -I"$src/runtime/src/nvn" -I"$KAZUMA_VK_HEADERS" \
            -c "$src/runtime/src/nvn/nvn_gpu_pick.cpp" \
            -o "$RUNNER_TEMP/kazuma35/nvn_gpu_pick_real.o" \
            2>&1 | tee relatorios/etapa35/COMPILAR_VULKAN_REAL.log
          readelf -h "$RUNNER_TEMP/kazuma35/nvn_gpu_pick_real.o" | tee relatorios/etapa35/ELF_HEADER.txt
          llvm-nm-18 -C "$RUNNER_TEMP/kazuma35/nvn_gpu_pick_real.o" > relatorios/etapa35/SIMBOLOS.txt
          grep -Eq 'Machine:.*Advanced Micro Devices X86-64' relatorios/etapa35/ELF_HEADER.txt
          grep -Fq 'pick_physical_device' relatorios/etapa35/SIMBOLOS.txt
          grep -Fq 'p_vkGetPhysicalDeviceProperties' relatorios/etapa35/SIMBOLOS.txt
          grep -Fq 'nx::log' relatorios/etapa35/SIMBOLOS.txt
          sha256sum "$RUNNER_TEMP/kazuma35/nvn_gpu_pick_real.o" > relatorios/etapa35/SHA256.txt
          echo 'SUCESSO: modulo original NVN compilou para alvo PS4 com caminho Vulkan ATIVO (nao standalone).' | tee relatorios/etapa35/RESULTADO.txt
          echo 'SIMBOLOS externos Vulkan/runtime continuam por resolver: isto NAO e programa executavel, nao e port e nao foi testado no console.' | tee -a relatorios/etapa35/RESULTADO.txt
      - name: Publicar relatorios de COMPILACAO sem PKG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kazuma-etapa35-nvn-vulkan-real-x86-64-sem-pkg
          path: relatorios/etapa35/
          if-no-files-found: warn
          retention-days: 20
