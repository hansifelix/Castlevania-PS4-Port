name: 'Kazuma PS4 - NVN + vkloader + Mesa RADV ICD real (sem jogo)'
on:
  pull_request:
    paths:
      - 'src/ps4/platform_ps4_vulkan_loader.cpp'
      - 'tools/etapa62/ps4_vulkan_bridge.cpp'
      - 'tools/link/ps4_nvn_vulkan_closure.py'
      - 'tools/link/ps4_vkloader_icd_gate.py'
      - 'tests/test_ps4_vkloader_icd_gate.py'
      - 'tools/link/ps4_radv_icd_gate.py'
      - 'tests/test_ps4_radv_icd_gate.py'
      - 'tools/link/ps4_radv_symbol_inventory.py'
      - 'tests/test_ps4_radv_symbol_inventory.py'
      - 'tools/link/ps4_elf_undefined_types.py'
      - 'tests/test_ps4_elf_undefined_types.py'
      - 'tools/link/strict_link_no_storage.py'
      - 'tests/test_strict_link_no_storage.py'
      - 'tools/link/ps4_sdk_symbol_provider_audit.py'
      - 'tests/test_ps4_sdk_symbol_provider_audit.py'
      - 'tools/link/strict_link_unlimited.py'
      - 'tools/link/compile_full_runtime.py'
      - 'tests/test_compile_full_runtime.py'
      - 'tests/test_strict_link_unlimited.py'
      - 'tests/test_ps4_nvn_vulkan_closure.py'
      - '.github/workflows/kazuma-ps4-nvn-radv-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gpu-partial-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Run small synthetic parser tests and install compiler
        run: |
          set -euo pipefail
          python3 tests/test_ps4_nvn_vulkan_closure.py
          python3 tests/test_ps4_vkloader_icd_gate.py
          python3 tests/test_ps4_radv_icd_gate.py
          python3 tests/test_ps4_radv_symbol_inventory.py
          python3 tests/test_ps4_elf_undefined_types.py
          python3 tests/test_strict_link_no_storage.py
          python3 tests/test_ps4_sdk_symbol_provider_audit.py
          python3 tests/test_strict_link_unlimited.py
          python3 tests/test_compile_full_runtime.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 git curl ca-certificates
      - name: Fetch pinned real runtime, OpenOrbis and Khronos Vulkan headers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk"
          curl -fL --retry 5 --retry-delay 5 \
            'https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz' \
            -o "$RUNNER_TEMP/openorbis.tar.gz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/openorbis.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/openorbis.tar.gz" -C "$RUNNER_TEMP/sdk"
          sdk_link="$(find "$RUNNER_TEMP/sdk" -name link.x -type f -print -quit)"
          test -s "$sdk_link"
          echo "KAZUMA_SDK=$(dirname "$sdk_link")" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --sparse https://github.com/SwonDev/cstlvnia-blmont-to-macos.git "$RUNNER_TEMP/nx-src"
          git -C "$RUNNER_TEMP/nx-src" checkout -q --detach 4043f21bb4f656d34cd17ba070238c7728d00631
          git -C "$RUNNER_TEMP/nx-src" sparse-checkout set CMakeLists.txt runtime/src runtime/include/nx games/castlevania
          test -s "$RUNNER_TEMP/nx-src/runtime/src/nvn/nvn_vk.cpp"
          echo "KAZUMA_NX_SOURCE=$RUNNER_TEMP/nx-src" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --sparse https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vkh"
          git -C "$RUNNER_TEMP/vkh" checkout -q --detach acbb9391c0a597272800cd3f4363661c00a27c77
          git -C "$RUNNER_TEMP/vkh" sparse-checkout set include/vulkan include/vk_video
          test -s "$RUNNER_TEMP/vkh/include/vulkan/vulkan.h"
          echo "KAZUMA_VK_INCLUDE=$RUNNER_TEMP/vkh/include" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --sparse https://github.com/orbis-ports/orbis-porting-kit.git "$RUNNER_TEMP/orbis-kit"
          git -C "$RUNNER_TEMP/orbis-kit" checkout -q --detach bdf17b594ba33dee266752f77cf87728130597e5
          git -C "$RUNNER_TEMP/orbis-kit" sparse-checkout set vkloader
          test -s "$RUNNER_TEMP/orbis-kit/vkloader/vkloader.c"
          test -s "$RUNNER_TEMP/orbis-kit/vkloader/vkloader.h"
          echo "KAZUMA_REAL_VKLOADER=$RUNNER_TEMP/orbis-kit/vkloader" >> "$GITHUB_ENV"
      - name: Fetch immutable paired Mesa/RADV/headers/zlib PS4 bundle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/radv-bundle"
          curl -fLsS --retry 5 --retry-delay 5 \
            'https://github.com/orbis-ports/orbis-porting-kit/releases/download/orbis-sdk-v1/orbis-sdk-v1.tar.gz' \
            -o "$RUNNER_TEMP/orbis-sdk-v1.tar.gz"
          echo "f4f079a4df334b46a76996f895283904283d6a006f97102aafaa53d4ecfc9622  $RUNNER_TEMP/orbis-sdk-v1.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/orbis-sdk-v1.tar.gz" -C "$RUNNER_TEMP/radv-bundle"
          bundle="$RUNNER_TEMP/radv-bundle/orbis-sdk-v1"
          mesa="$bundle/mesa"
          radv="$mesa/build-orbis/src/amd/vulkan/libvulkan_radeon.a"
          test -s "$radv"
          test -s "$mesa/include/vulkan/vulkan.h"
          shopt -s nullglob
          zlibs=("$mesa"/build-orbis/subprojects/zlib-*/libz.a)
          test "${#zlibs[@]}" -eq 1 && test -s "${zlibs[0]}"
          echo "KAZUMA_RADV_ARCHIVE=$radv" >> "$GITHUB_ENV"
          echo "KAZUMA_ZLIB_ARCHIVE=${zlibs[0]}" >> "$GITHUB_ENV"
          echo "KAZUMA_VK_INCLUDE=$mesa/include" >> "$GITHUB_ENV"
          echo "KAZUMA_KHRONOS_INCLUDE=$RUNNER_TEMP/vkh/include" >> "$GITHUB_ENV"
      - name: Patch only runner C++20 cpu.h to match OpenOrbis libc++
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compat/nx"
          cat > "$RUNNER_TEMP/compat/nx/kazuma_cpu_compat.h" <<'CPP'
          #pragma once
          #include <cstdint>
          #include <type_traits>
          namespace kazuma_cpu_compat {
          template <typename To, typename From>
          constexpr To bit_cast(const From& from) noexcept {
              static_assert(sizeof(To)==sizeof(From));
              static_assert(std::is_trivially_copyable_v<To> && std::is_trivially_copyable_v<From>);
              return __builtin_bit_cast(To, from);
          }
          template <typename T>
          constexpr T rotr(T v, int shift) noexcept {
              static_assert(std::is_unsigned_v<T>);
              constexpr int nbits=int(sizeof(T)*8);
              int n=((shift % nbits) + nbits) % nbits;
              return n ? T((v >> n) | (v << (nbits - n))) : v;
          }
          }
          CPP
          python3 - <<'PY'
          import os
          from pathlib import Path
          original=(Path(os.environ["KAZUMA_NX_SOURCE"])/"runtime/include/nx/cpu.h").read_text()
          assert original.count("#include <bit>")==1
          assert original.count("std::bit_cast")>=5 and original.count("std::rotr(")==2
          patched=(original.replace("#include <bit>", '#include "kazuma_cpu_compat.h"')
                           .replace("std::bit_cast","kazuma_cpu_compat::bit_cast")
                           .replace("std::rotr(","kazuma_cpu_compat::rotr("))
          (Path(os.environ["RUNNER_TEMP"])/"compat/nx/cpu.h").write_text(patched)
          PY
      - name: Compilar adaptadores Vulkan PS4 e vkloader oficial
        run: |
          set -euo pipefail
          src="$KAZUMA_NX_SOURCE/runtime"
          sdk="$KAZUMA_SDK"
          mkdir -p "$RUNNER_TEMP/nvn-gpu"
          count=0
          for source in \
              tools/etapa62/ps4_vulkan_bridge.cpp \
              src/ps4/platform_ps4_vulkan_loader.cpp; do
            obj="$RUNNER_TEMP/nvn-gpu/$count.o"
            clang++-18 --target=x86_64-pc-freebsd12-elf -std=c++20 -O1 -fPIC \
              -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE -DKAZUMA_PS4_REAL_VULKAN=1 \
              -isysroot "$sdk" -isystem "$sdk/include" -isystem "$sdk/include/c++/v1" \
              -I"$RUNNER_TEMP/compat" -I"$src/include" -I"$src/src" \
              -I"$KAZUMA_VK_INCLUDE" -I"$KAZUMA_KHRONOS_INCLUDE" -include algorithm \
              -c "$source" -o "$obj"
            test -s "$obj"
            count=$((count+1))
          done
          test "$count" -eq 2
          clang-18 --target=x86_64-pc-freebsd12-elf -std=c11 -O1 -fPIC \
            -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE -D__ORBIS__=1 \
            -isysroot "$sdk" -isystem "$sdk/include" \
            -I"$KAZUMA_VK_INCLUDE" -I"$KAZUMA_KHRONOS_INCLUDE" -I"$KAZUMA_REAL_VKLOADER" \
            -c "$KAZUMA_REAL_VKLOADER/vkloader.c" \
            -o "$RUNNER_TEMP/nvn-gpu/2.o"
          test -s "$RUNNER_TEMP/nvn-gpu/2.o"
          ld.lld-18 -m elf_x86_64 -r \
            -o "$RUNNER_TEMP/nvn-gpu/gpu-adapters.o" \
            "$RUNNER_TEMP/nvn-gpu/"{0..2}.o
          test -s "$RUNNER_TEMP/nvn-gpu/gpu-adapters.o"
          echo 'KAZUMA_PS4_VULKAN_BRIDGE_AND_OFFICIAL_VKLOADER=COMPILED_NO_GAME'

      - name: Compilar runtime publico completo e unir NVN com Mesa RADV
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/link/compile_full_runtime.py \
            --upstream "$KAZUMA_NX_SOURCE" \
            --sdk "$KAZUMA_SDK" \
            --compat "$RUNNER_TEMP/compat" \
            --vulkan "$KAZUMA_KHRONOS_INCLUDE" \
            --mesa "$KAZUMA_VK_INCLUDE" \
            --out "$RUNNER_TEMP/runtime-objects"
          count="$(find "$RUNNER_TEMP/runtime-objects" -maxdepth 1 -type f -name '*.o' | wc -l)"
          test "$count" -eq 88
          ld.lld-18 -m elf_x86_64 -r \
            -o "$RUNNER_TEMP/nvn-gpu/combined.o" \
            "$RUNNER_TEMP/runtime-objects/"*.o \
            "$RUNNER_TEMP/nvn-gpu/gpu-adapters.o" \
            --whole-archive "$KAZUMA_RADV_ARCHIVE" --no-whole-archive \
            "$KAZUMA_ZLIB_ARCHIVE"
          test -s "$RUNNER_TEMP/nvn-gpu/combined.o"
          llvm-readelf-18 --file-header "$RUNNER_TEMP/nvn-gpu/combined.o" \
            | grep -E 'Class:|Machine:'
          llvm-nm-18 -C --defined-only "$RUNNER_TEMP/nvn-gpu/combined.o" > "$RUNNER_TEMP/nvn-gpu/defined.nm"
          llvm-nm-18 -C --undefined-only "$RUNNER_TEMP/nvn-gpu/combined.o" > "$RUNNER_TEMP/nvn-gpu/undefined.nm"
          llvm-readelf-18 --symbols --wide "$RUNNER_TEMP/nvn-gpu/combined.o" > "$RUNNER_TEMP/nvn-gpu/symbols.readelf"
          python3 tools/link/ps4_radv_icd_gate.py \
            --defined "$RUNNER_TEMP/nvn-gpu/defined.nm" \
            --undefined "$RUNNER_TEMP/nvn-gpu/undefined.nm"
          python3 tools/link/ps4_radv_symbol_inventory.py \
            --undefined "$RUNNER_TEMP/nvn-gpu/undefined.nm"
          python3 tools/link/ps4_elf_undefined_types.py \
            --symbols "$RUNNER_TEMP/nvn-gpu/symbols.readelf"
          python3 tools/link/ps4_sdk_symbol_provider_audit.py \
            --symbols "$RUNNER_TEMP/nvn-gpu/symbols.readelf" \
            --lib-dir "$KAZUMA_SDK/lib" \
            --nm llvm-nm-18 \
            --timeout 20
          echo 'KAZUMA_FULL_PUBLIC_RUNTIME_PLUS_NVNVK_RADV=RELOCATABLE_ELF64_ONLY'
          echo 'KAZUMA_PS4_SDK_IMPORT_PROVIDER_AUDIT=COMPLETE_PRESENCE_ONLY_NOT_LINK_RESOLUTION'
          echo 'KAZUMA_GAME_AOT_AND_HARDWARE=NOT_INCLUDED_NOT_TESTED'
      - name: Strict PS4 link diagnostic for the real NVN/RADV slice (no ELF output)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/link/strict_link_unlimited.py \
            --sdk "$KAZUMA_SDK" \
            --object "$RUNNER_TEMP/nvn-gpu/combined.o" \
            --linker ld.lld-18 \
            --timeout 900 \
            --extra-lib SceGnmDriver
      # Only log text; large combined Mesa object remains ephemeral on Actions runner.
