name: 'Kazuma Etapa 44 - link estrito 8 APIs reais (SEM PKG)'
on:
  pull_request:
    paths:
      - '.github/workflows/kazuma-etapa44-smoke-8-apis.yml'
      - 'tools/etapa44/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-apis-reais:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Kazuma
        uses: actions/checkout@v4
      - name: Instalar compiladores e testes
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 lld-18 binutils python3 curl ca-certificates git
      - name: Obter OpenOrbis v0.5.4 com verificacao de integridade
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk" "$RUNNER_TEMP/download"
          curl -fLsS --retry 3 --retry-delay 3 \
            'https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz' \
            -o "$RUNNER_TEMP/download/openorbis.tar.gz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/download/openorbis.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/download/openorbis.tar.gz" -C "$RUNNER_TEMP/sdk"
          sdk_link="$(find "$RUNNER_TEMP/sdk" -type f -name link.x -print -quit)"
          test -n "$sdk_link"
          echo "OO_PS4_TOOLCHAIN=$(dirname "$sdk_link")" >> "$GITHUB_ENV"
      - name: Obter interface publica do runtime no commit fixado
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kazuma-src44"
          curl -fLsS --retry 3 \
            'https://raw.githubusercontent.com/SwonDev/cstlvnia-blmont-to-macos/4043f21bb4f656d34cd17ba070238c7728d00631/runtime/src/platform.h' \
            -o "$RUNNER_TEMP/kazuma-src44/platform.h"
          grep -q 'namespace nx::plat' "$RUNNER_TEMP/kazuma-src44/platform.h"
          echo "KAZUMA_SRC44=$RUNNER_TEMP/kazuma-src44" >> "$GITHUB_ENV"
      - name: Testar auditoria e codigo do experimento
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/etapa44 -p 'test_*.py' -v
          bash -n tools/etapa44/testar_link_apis.sh
      - name: Compilar oito APIs reais e tentar link estrito
        run: |
          set -euo pipefail
          bash tools/etapa44/testar_link_apis.sh
      - name: Publicar SOMENTE relatorios, nunca ELF/PKG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kazuma-etapa44-smoke-8-apis-link-relatorios-sem-pkg
          path: relatorios/etapa44/
          if-no-files-found: warn
          retention-days: 20
