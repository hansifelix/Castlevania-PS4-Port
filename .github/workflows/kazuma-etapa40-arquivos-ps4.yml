name: 'Kazuma Etapa 40 - arquivos PS4 x86-64 (SEM PKG)'
on:
  push:
    branches:
      - kazuma-etapa40-arquivos-ps4
    paths:
      - '.github/workflows/kazuma-etapa40-arquivos-ps4.yml'
      - 'tools/etapa40/**'
  pull_request:
    paths:
      - '.github/workflows/kazuma-etapa40-arquivos-ps4.yml'
      - 'tools/etapa40/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arquivos-plataforma:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Kazuma
        uses: actions/checkout@v4
      - name: Instalar compiladores e utilitarios
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 binutils g++ git curl ca-certificates
      - name: Preparar SDK e interface publica fixados
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk" "$RUNNER_TEMP/download" relatorios/etapa40
          curl -fLsS --retry 3 --retry-delay 3 \
            'https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz' \
            -o "$RUNNER_TEMP/download/openorbis.tar.gz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/download/openorbis.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/download/openorbis.tar.gz" -C "$RUNNER_TEMP/sdk"
          sdk_link="$(find "$RUNNER_TEMP/sdk" -type f -name link.x -print -quit)"
          test -n "$sdk_link"
          echo "OO_PS4_TOOLCHAIN=$(dirname "$sdk_link")" >> "$GITHUB_ENV"
          git clone -q --filter=blob:none --sparse https://github.com/SwonDev/cstlvnia-blmont-to-macos.git "$RUNNER_TEMP/nx-src"
          git -C "$RUNNER_TEMP/nx-src" checkout -q --detach 4043f21bb4f656d34cd17ba070238c7728d00631
          git -C "$RUNNER_TEMP/nx-src" sparse-checkout set runtime/src
          test -s "$RUNNER_TEMP/nx-src/runtime/src/platform.h"
          git -C "$RUNNER_TEMP/nx-src" show HEAD:LICENSE > relatorios/etapa40/LICENCA_MIT.txt
          echo "KAZUMA_PLATFORM_H=$RUNNER_TEMP/nx-src/runtime/src" >> "$GITHUB_ENV"
          printf '%s\n' 'OpenOrbis v0.5.4 SHA256 verificado' \
            'Interface runtime: commit 4043f21bb4f656d34cd17ba070238c7728d00631 (MIT)' \
            'Somente compilacao e testes Linux; sem ROMs, APK, PKG e teste real PS4' \
            > relatorios/etapa40/FONTES.txt
      - name: Testar leitura e diretorios NO LINUX, sem jogo
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -I"$KAZUMA_PLATFORM_H" \
            tools/etapa40/platform_ps4_files.cpp \
            tools/etapa40/tests/test_files_linux.cpp \
            -o "$RUNNER_TEMP/test_files_linux" 2>&1 | tee relatorios/etapa40/COMPILACAO_LINUX.txt
          "$RUNNER_TEMP/test_files_linux" | tee relatorios/etapa40/TESTE_LINUX.txt
      - name: Compilar cinco funcoes de arquivo para alvo x86-64 PS4
        run: |
          set -euo pipefail
          sdk="$OO_PS4_TOOLCHAIN"
          clang++-18 --target=x86_64-pc-freebsd12-elf -std=c++20 -O1 -fPIC \
            -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE \
            -isysroot "$sdk" -isystem "$sdk/include" -isystem "$sdk/include/c++/v1" \
            -I"$KAZUMA_PLATFORM_H" \
            -c tools/etapa40/platform_ps4_files.cpp \
            -o "$RUNNER_TEMP/kazuma40-files.o" \
            2>&1 | tee relatorios/etapa40/COMPILACAO_PS4.txt
          readelf -h "$RUNNER_TEMP/kazuma40-files.o" > relatorios/etapa40/ELF.txt
          llvm-nm-18 -C --defined-only "$RUNNER_TEMP/kazuma40-files.o" > relatorios/etapa40/DEFINIDOS.txt
          llvm-nm-18 -C -u "$RUNNER_TEMP/kazuma40-files.o" > relatorios/etapa40/DEPENDENCIAS_EXTERNAS.txt || true
          grep -Eq 'Machine:.*Advanced Micro Devices X86-64' relatorios/etapa40/ELF.txt
          for sym in 'fopen_utf8(' 'ftell64(' 'fseek64(' 'read_at(' 'make_dirs('; do
            grep -Fq "nx::plat::$sym" relatorios/etapa40/DEFINIDOS.txt
          done
          sha256sum "$RUNNER_TEMP/kazuma40-files.o" > relatorios/etapa40/SHA256.txt
          printf '%s\n' 'RESULTADO: 5 APIs nx::plat compiladas para x86-64 PS4, testadas apenas em Linux.' \
            'NAO foi feito link do runtime inteiro, NAO gera ELF executavel/PKG, NAO testa PS4.' \
            'Etapa seguinte: link parcial com os 87 objetos e levantamento das referencias externas reais.' \
            | tee relatorios/etapa40/RESULTADO.txt
      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kazuma-etapa40-apis-arquivos-ps4-sem-pkg
          path: relatorios/etapa40/
          if-no-files-found: warn
          retention-days: 20
