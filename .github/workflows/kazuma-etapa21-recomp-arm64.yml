name: 'Kazuma - Etapa 21: codigo ARM64 sintetico recompilado para PS4 (SEM PKG)'
on:
  pull_request:
    paths:
      - '.github/workflows/kazuma-etapa21-recomp-arm64.yml'
      - 'tools/etapa21/**'
      - 'docs/KAZUMA_ETAPA21_AARCH64_REAL.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recompilar-sintetico:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Kazuma
        uses: actions/checkout@v4
      - name: Testes locais sem arquivos do jogo
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/etapa21/tests -v
          python3 -m py_compile tools/etapa21/gerar_recomp_sintetico.py
          bash -n tools/etapa21/compilar_recomp_ps4.sh
      - name: Instalar compiladores
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld binutils curl ca-certificates git python3 python3-venv python3-pip g++
      - name: Obter OpenOrbis v0.5.4 hash fixo
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk-bundle" "$RUNNER_TEMP/sdk"
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz' \
            -o "$RUNNER_TEMP/sdk-bundle/openorbis.tar.gz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/sdk-bundle/openorbis.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/sdk-bundle/openorbis.tar.gz" -C "$RUNNER_TEMP/sdk"
          sdk_link="$(find "$RUNNER_TEMP/sdk" -type f -name link.x -print -quit)"
          test -n "$sdk_link"
          sdk="$(dirname "$sdk_link")"
          test -s "$sdk/lib/crt1.o"
          echo "OO_PS4_TOOLCHAIN=$sdk" >> "$GITHUB_ENV"
      - name: Obter contratos CPU do runtime fixado
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --sparse https://github.com/SwonDev/cstlvnia-blmont-to-macos.git "$RUNNER_TEMP/nx-src"
          git -C "$RUNNER_TEMP/nx-src" checkout -q --detach 4043f21bb4f656d34cd17ba070238c7728d00631
          git -C "$RUNNER_TEMP/nx-src" sparse-checkout set runtime/include/nx
          test -s "$RUNNER_TEMP/nx-src/runtime/include/nx/cpu.h"
          echo "KAZUMA_NX_SOURCE=$RUNNER_TEMP/nx-src" >> "$GITHUB_ENV"
      - name: Obter o recompilador publico fixado (nao inclui jogo)
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none --sparse https://github.com/BelmanteGu/SuperMarioWonderRecomp.git "$RUNNER_TEMP/recomp-src"
          git -C "$RUNNER_TEMP/recomp-src" checkout -q --detach 010ed7a596a621c15d3a8dfa5795ca8c3668b066
          git -C "$RUNNER_TEMP/recomp-src" sparse-checkout set recomp
          test -s "$RUNNER_TEMP/recomp-src/recomp/emit.py"
          echo "KAZUMA_RECOMP_SOURCE=$RUNNER_TEMP/recomp-src" >> "$GITHUB_ENV"
      - name: Recompilar ARM64 sintetico e gerar ELF x86-64 PS4
        run: |
          set -euo pipefail
          bash tools/etapa21/compilar_recomp_ps4.sh "$OO_PS4_TOOLCHAIN" "$KAZUMA_NX_SOURCE" "$KAZUMA_RECOMP_SOURCE" 2>&1 | tee etapa21_execucao.txt
          python3 - <<'PY_CHECK'
          from pathlib import Path
          import json
          x=json.loads(Path('relatorios/etapa21/resultado.json').read_text())
          assert x['quantidade_instrucoes']==3 and x['funcoes_detectadas']==1
          assert x['compilou_recompilado_cpp_no_ps4'] and x['linkou_elf_target_ps4']
          assert x['executou_cpp_gerado_em_linux']
          assert x['recompilacao_do_jogo'] is False
          assert x['executou_elf_no_ps4'] is False and x['gerou_pkg'] is False
          assert x['viabilidade_castlevania']=='INDETERMINADA'
          print('Gate Etapa21 OK: recompiler original AArch64 sintetico -> C++ -> OpenOrbis x86-64; nao e port do jogo.')
          PY_CHECK
      - name: Publicar diagnosticos mesmo em falha — SEM PKG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kazuma-etapa21-recompilador-sem-pkg
          path: |
            etapa21_execucao.txt
            relatorios/etapa21/
          if-no-files-found: warn
          retention-days: 30
