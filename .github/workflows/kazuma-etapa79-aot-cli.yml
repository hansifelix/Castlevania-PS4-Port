name: Kazuma Etapa 79 — NSO sintetico pelo CLI real do recompilador
on:
  push:
    paths:
      - 'tools/etapa79/**'
      - 'tests/test_aot_private.py'
      - '.github/workflows/kazuma-etapa79-aot-cli.yml'
  pull_request:
    paths:
      - 'tools/etapa79/**'
      - 'tests/test_aot_private.py'
      - 'docs/KAZUMA_ETAPA79.md'
      - '.github/workflows/kazuma-etapa79-aot-cli.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aot-um-nso-sintetico:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout do laboratorio sem ROMs
        uses: actions/checkout@v4
      - name: Testar isolamento e gerador sintético
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_aot_private.py -v
          python3 -m py_compile tools/etapa79/*.py
      - name: Preparar recompilador publico fixado
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" -q install capstone==5.0.6 lz4==4.4.4
          git clone -q --filter=blob:none --sparse https://github.com/SwonDev/cstlvnia-blmont-to-macos.git "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" checkout -q --detach 4043f21bb4f656d34cd17ba070238c7728d00631
          git -C "$RUNNER_TEMP/upstream" sparse-checkout set recomp
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)" = 4043f21bb4f656d34cd17ba070238c7728d00631
          test -s "$RUNNER_TEMP/upstream/recomp/__main__.py"
      - name: Gerar e recompilar um NSO sintético pela CLI original
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aot-private"
          python3 tools/etapa79/make_synthetic_nso.py --out "$RUNNER_TEMP/aot-private/synthetic.nso"
          export PYTHONPATH="$RUNNER_TEMP/upstream"
          "$RUNNER_TEMP/venv/bin/python" -m recomp \
            "$RUNNER_TEMP/aot-private/synthetic.nso" \
            "$RUNNER_TEMP/aot-private/output" \
            --name kazuma_synthetic --base 0x4000000000 --exceptions \
            > "$RUNNER_TEMP/aot-private/recomp.stdout.txt" \
            2> "$RUNNER_TEMP/aot-private/recomp.stderr.txt"
          test -s "$RUNNER_TEMP/aot-private/output/funcs.h"
          test -s "$RUNNER_TEMP/aot-private/output/table.cpp"
          test -s "$RUNNER_TEMP/aot-private/output/code_000.cpp"
          test -s "$RUNNER_TEMP/aot-private/output/report.txt"
          grep -q "unhandled 0" "$RUNNER_TEMP/aot-private/output/report.txt"
          grep -q "handled 3" "$RUNNER_TEMP/aot-private/output/report.txt"
          grep -q "kazuma_synthetic_00000020" "$RUNNER_TEMP/aot-private/output/code_000.cpp"
          echo "NSO0 -> recomp CLI original -> C++ auditavel: 3 instrucoes ARM64 sintéticas, 0 unhandled."
      - name: Publicar somente provas sintéticas e log filtrado
        if: always()
        run: |
          mkdir -p reports/etapa79
          if [ -f "$RUNNER_TEMP/aot-private/output/report.txt" ]; then
            cp "$RUNNER_TEMP/aot-private/output/report.txt" reports/etapa79/relatorio-sintetico.txt
          fi
          if [ -f "$RUNNER_TEMP/aot-private/recomp.stderr.txt" ]; then
            tail -100 "$RUNNER_TEMP/aot-private/recomp.stderr.txt" > reports/etapa79/erros-sinteticos.txt
          fi
      - name: Artefato sem dados comerciais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kazuma79-somente-fixture
          path: reports/etapa79/
          if-no-files-found: warn
          retention-days: 14
