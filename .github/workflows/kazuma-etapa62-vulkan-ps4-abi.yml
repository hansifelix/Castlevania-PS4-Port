name: 'Kazuma Etapa 62 - Ponte Vulkan ABI PS4 real (SEM JOGO, SEM PKG)'
on:
  pull_request:
    paths:
      - '.github/workflows/kazuma-etapa62-vulkan-ps4-abi.yml'
      - 'tools/etapa62/**'
      - 'docs/KAZUMA_ETAPA62.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificacao-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias clang e cabecalhos Vulkan oficiais
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 lld-18 binutils git curl ca-certificates python3
          git clone -q --filter=blob:none --sparse https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vkh"
          git -C "$RUNNER_TEMP/vkh" checkout -q --detach acbb9391c0a597272800cd3f4363661c00a27c77
          git -C "$RUNNER_TEMP/vkh" sparse-checkout set include/vulkan include/vk_video
          test -s "$RUNNER_TEMP/vkh/include/vulkan/vulkan.h"
          echo "KAZUMA_VULKAN_HEADERS=$RUNNER_TEMP/vkh/include" >> "$GITHUB_ENV"
      - name: Compilar teste de contrato (somente mock no Linux)
        run: |
          set -euo pipefail
          mkdir -p relatorios/etapa62
          clang++-18 -std=c++17 -Wall -Wextra -Werror -O1 \
             -Itools/etapa62/tests/include \
             tools/etapa62/ps4_vulkan_bridge.cpp tools/etapa62/tests/test_bridge.cpp \
             -o "$RUNNER_TEMP/kazuma62_test"
          "$RUNNER_TEMP/kazuma62_test" | tee relatorios/etapa62/TESTE_LOGICA_MOCK.txt
          grep -Fq 'CONTRATO_VULKAN=OK' relatorios/etapa62/TESTE_LOGICA_MOCK.txt
      - name: SDK OpenOrbis fixado (mesma base usada na Etapa 35)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk" "$RUNNER_TEMP/download"
          curl -fLsS --retry 3 --retry-delay 3 \
            'https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz' \
            -o "$RUNNER_TEMP/download/openorbis.tar.gz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/download/openorbis.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/download/openorbis.tar.gz" -C "$RUNNER_TEMP/sdk"
          sdk_link="$(find "$RUNNER_TEMP/sdk" -type f -name link.x -print -quit)"
          test -n "$sdk_link"
          echo "KAZUMA_PS4_SDK=$(dirname "$sdk_link")" >> "$GITHUB_ENV"
      - name: Compilar objeto ELF64 x86-64 contra Vulkan real e headers PS4
        run: |
          set -euo pipefail
          sdk="$KAZUMA_PS4_SDK"
          clang++-18 --target=x86_64-pc-freebsd12-elf -std=c++17 -O1 -fPIC \
             -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE \
             -isysroot "$sdk" -isystem "$sdk/include" -isystem "$sdk/include/c++/v1" \
             -I"$KAZUMA_VULKAN_HEADERS" \
             -c tools/etapa62/ps4_vulkan_bridge.cpp \
             -o relatorios/etapa62/ps4_vulkan_bridge.o \
             2>&1 | tee relatorios/etapa62/COMPILAR_PS4.log
          readelf -h relatorios/etapa62/ps4_vulkan_bridge.o | tee relatorios/etapa62/ELF_HEADER.txt
          llvm-nm-18 -C relatorios/etapa62/ps4_vulkan_bridge.o | tee relatorios/etapa62/SIMBOLOS.txt
          sha256sum relatorios/etapa62/ps4_vulkan_bridge.o > relatorios/etapa62/SHA256.txt
          grep -Eq 'Machine:.*Advanced Micro Devices X86-64' relatorios/etapa62/ELF_HEADER.txt
          grep -Eq 'Type:.*REL' relatorios/etapa62/ELF_HEADER.txt
          grep -Fq 'nx::plat::vulkan_get_instance_proc_addr()' relatorios/etapa62/SIMBOLOS.txt
          grep -Fq 'nx::plat::vulkan_surface_extension()' relatorios/etapa62/SIMBOLOS.txt
          grep -Fq 'nx::plat::vulkan_create_surface(' relatorios/etapa62/SIMBOLOS.txt
          grep -Fq 'nx::plat::ps4::vk_get_instance_proc_addr()' relatorios/etapa62/SIMBOLOS.txt
          echo 'KAZUMA62: OBJETO_X86_64_COM_HEADERS_VULKAN_REAIS=OK; LINK_PENDENTE (MESA/WSI)' | tee relatorios/etapa62/RESULTADO.txt
      - name: Publicar relatorios (SEM executable/PKG)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kazuma-etapa62-abi-real-ps4-sem-pkg
          path: relatorios/etapa62/
          retention-days: 20
